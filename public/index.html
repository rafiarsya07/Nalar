<script>
  /* Apply the saved reading theme before first paint so there is no flash. */
  (function(){
    try{
      var t=localStorage.getItem("tl_theme");
      if(t!=="light"&&t!=="sepia"&&t!=="dark"){
        t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
      }
      document.documentElement.setAttribute("data-theme",t);
    }catch(e){document.documentElement.setAttribute("data-theme","light")}
  })();
</script>
<style>
  /* ==========================================================================
     NALAR — design system
     Reading experience modelled on Medium: one narrow column, sans display
     type, serif body at 21px, almost no chrome. The palette is warm rather
     than pure grey so it still reads as Nalar and not as a clone.
     Type: Poppins (UI + headings, same as the portfolio), Source Serif 4
     (article body), JetBrains Mono (meta).
     ========================================================================== */

  :root{
    --bg:#fffefb;
    --surface:#ffffff;
    --surface-2:#faf7f1;
    --ink:#1b1915;
    --ink-2:#57534a;
    --muted:#8b8478;
    --rule:#e9e4da;
    --rule-2:#f4f0e8;
    --accent:#4e6b35;
    --accent-hover:#3f5729;
    --accent-soft:#edf2e6;
    --accent-ink:#3c5327;
    --amber:#9a6f24;
    --amber-soft:#f7efdd;
    --danger:#a8412c;
    --danger-soft:#f9e8e3;
    --shadow-sm:0 1px 2px rgba(30,26,18,.05);
    --shadow:0 2px 14px rgba(30,26,18,.08);
    --shadow-lg:0 16px 46px rgba(30,26,18,.16);
    --ease:cubic-bezier(.22,.61,.36,1);
    --radius:10px;
    --radius-sm:7px;
    --font-ui:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
    --font-display:"Poppins",system-ui,sans-serif;
    --font-read:"Source Serif 4",Charter,Georgia,"Times New Roman",serif;
    --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --measure:680px;
    --reader-fs:1;
    --reader-measure:680px;
    --header-h:58px;
  }
  html[data-theme="sepia"]{
    --bg:#f7f1e4;
    --surface:#fbf6ec;
    --surface-2:#f2ead9;
    --ink:#2c251a;
    --ink-2:#584d3c;
    --muted:#8a7c63;
    --rule:#e0d5bd;
    --rule-2:#ece3ce;
    --accent:#5c6b2f;
    --accent-hover:#4b5824;
    --accent-soft:#e7e6cd;
    --accent-ink:#4a5525;
    --amber:#8d6519;
    --amber-soft:#eee0c1;
  }
  html[data-theme="dark"]{
    --bg:#131211;
    --surface:#1a1917;
    --surface-2:#211f1c;
    --ink:#eae5db;
    --ink-2:#b9b2a5;
    --muted:#8c8578;
    --rule:#2e2b26;
    --rule-2:#24221e;
    --accent:#9db97a;
    --accent-hover:#b0c98f;
    --accent-soft:#232a1c;
    --accent-ink:#b6cf94;
    --amber:#cda45f;
    --amber-soft:#2c2416;
    --danger:#d4836d;
    --danger-soft:#33201b;
    --shadow-sm:0 1px 2px rgba(0,0,0,.35);
    --shadow:0 2px 14px rgba(0,0,0,.4);
    --shadow-lg:0 16px 46px rgba(0,0,0,.6);
  }

  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:var(--font-ui);font-size:15px;line-height:1.6;font-weight:400;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    transition:background .2s var(--ease),color .2s var(--ease);
  }
  h1,h2,h3,h4{margin:0;font-family:var(--font-display);font-weight:600;line-height:1.24;letter-spacing:-.02em}
  p{margin:0 0 1em}
  a{color:inherit}
  img{max-width:100%}
  button,input,textarea,select{font:inherit;color:inherit}
  ::selection{background:var(--accent-soft);color:var(--accent-ink)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
  .mono{font-family:var(--font-mono)}
  .wrap{max-width:1160px;margin:0 auto;padding:0 24px}
  .eyebrow,.section-label{
    font-family:var(--font-ui);font-size:11px;font-weight:600;
    letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  }

  /* ==========================================================================
     HEADER
     ========================================================================== */
  header.site{
    position:sticky;top:0;z-index:70;height:var(--header-h);
    background:color-mix(in srgb,var(--bg) 94%,transparent);
    backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
    border-bottom:1px solid var(--rule);
    transition:transform .28s var(--ease);
  }
  header.site.nav-hidden{transform:translateY(-110%)}
  .topbar{max-width:1160px;margin:0 auto;padding:0 24px;height:100%;display:flex;align-items:center;gap:16px}
  .brand{
    display:flex;align-items:center;gap:10px;border:none;background:none;cursor:pointer;padding:0;
    font-family:var(--font-display);font-weight:600;font-size:21px;letter-spacing:-.03em;color:var(--ink);
    flex-shrink:0;
  }
  .brand-mark{
    width:28px;height:28px;border-radius:7px;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:-.02em;
  }
  html[data-theme="dark"] .brand-mark{color:#131211}
  .brand:hover .brand-mark{background:var(--accent-hover)}
  .brand-text{display:inline}

  .nav{display:flex;align-items:center;gap:4px;margin-left:auto}
  .nav-links{display:flex;align-items:center;gap:2px;margin-right:8px}
  .nav-links a{
    text-decoration:none;color:var(--ink-2);font-size:14px;font-weight:400;
    padding:6px 11px;border-radius:16px;cursor:pointer;transition:color .15s,background .15s;
  }
  .nav-links a:hover{color:var(--ink);background:var(--surface-2)}
  .nav-links a.on{color:var(--accent);font-weight:500}
  .nav-sep{display:none}
  .nav button{
    border:1px solid transparent;background:none;color:var(--ink-2);cursor:pointer;
    font-family:var(--font-ui);font-size:14px;font-weight:400;padding:6px 12px;border-radius:18px;
    display:inline-flex;align-items:center;gap:7px;transition:all .15s var(--ease);
  }
  .nav button:hover{color:var(--ink);background:var(--surface-2)}
  .nav button.primary{
    background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500;padding:7px 16px;
  }
  html[data-theme="dark"] .nav button.primary{color:#131211}
  .nav button.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
  .nav-icon-btn{
    width:34px;height:34px;padding:0!important;justify-content:center;border-radius:50%!important;
    transition:color .15s,background .15s,transform .2s var(--ease);
  }
  .nav-icon-btn:active{transform:scale(.88)}
  .nav-icon-btn svg{width:18px;height:18px}
  .nav-search-btn{
    display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);
    background:var(--surface-2);color:var(--muted);border-radius:18px;padding:6px 12px;
    cursor:pointer;font-size:13.5px;transition:all .15s var(--ease),transform .2s var(--ease);
  }
  .nav-search-btn:active{transform:scale(.94)}
  .nav-search-btn svg{width:15px;height:15px}
  .nav-search-btn kbd{font-family:var(--font-mono);font-size:10px;color:var(--muted)}
  .nav-search-btn:hover{border-color:var(--muted);color:var(--ink)}
  .nav-bookmark-btn{position:relative}
  .nav-bookmark-badge{
    position:absolute;top:0;right:0;min-width:16px;height:16px;padding:0 4px;border-radius:8px;
    background:var(--accent);color:#fff;font-family:var(--font-mono);font-size:9px;font-weight:600;
    display:flex;align-items:center;justify-content:center;
  }
  html[data-theme="dark"] .nav-bookmark-badge{color:#131211}
  .nav .short{display:none}
  .nav-sub svg{width:16px;height:16px}

  .progress-bar{
    position:fixed;top:0;left:0;height:3px;width:0;z-index:90;background:var(--accent);
    transition:width .08s linear;
  }

  /* ==========================================================================
     LAYOUT
     ========================================================================== */
  .page-grid{
    position:relative;max-width:var(--measure);margin:0 auto;padding:44px 24px 80px;display:block;
  }
  .page-grid.with-sidebar{
    max-width:1160px;
    display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:64px;align-items:start;
  }
  .page-grid.editor-wide,.page-grid.admin-wide{max-width:1200px}
  .page-main{min-width:0}
  .sidebar{display:none}
  .page-grid.with-sidebar .sidebar{
    display:block;position:sticky;top:calc(var(--header-h) + 28px);
    padding-left:32px;border-left:1px solid var(--rule);
  }
  .sidebar-left{display:none!important}
  .page-enter{animation:pageIn .26s var(--ease) both}
  @keyframes pageIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .reveal{opacity:0;transform:translateY(10px);transition:opacity .5s var(--ease),transform .5s var(--ease)}
  .reveal.in{opacity:1;transform:none}
  .section{margin:0 0 44px}
  .rule{height:1px;background:var(--rule);margin:40px 0;border:none}

  /* ==========================================================================
     BUTTONS + SMALL PARTS
     ========================================================================== */
  .btn{
    position:relative;overflow:hidden;isolation:isolate;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--accent);border:1px solid var(--accent);color:#fff;
    font-family:var(--font-ui);font-size:14px;font-weight:500;
    padding:9px 18px;border-radius:20px;cursor:pointer;
    transition:color .35s var(--ease),border-color .35s var(--ease),box-shadow .35s var(--ease),transform .2s var(--ease);
  }
  /* a panel of colour rises to fill the pill on hover instead of just
     tinting a border; the same move as the card hover, one signature
     interaction reused across every button on the site */
  .btn::before{
    content:"";position:absolute;inset:-1px;z-index:-1;background:var(--accent-hover);
    transform:translateY(101%);transition:transform .5s var(--ease);
  }
  .btn:hover::before{transform:translateY(0)}
  .btn:active{transform:scale(.96)}
  html[data-theme="dark"] .btn{color:#131211}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:transparent;border-color:var(--rule);color:var(--ink-2)}
  .btn.ghost::before{background:var(--ink)}
  .btn.ghost:hover{border-color:var(--ink);color:#fff}
  html[data-theme="dark"] .btn.ghost{color:var(--ink-2)}
  html[data-theme="dark"] .btn.ghost:hover{color:var(--bg)}
  .btn.small{font-size:13px;padding:6px 14px}
  .btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
  .btn.danger::before{background:#7c2c1c}
  html[data-theme="dark"] .btn.danger{color:#fff}
  .btn.amber{background:var(--amber);border-color:var(--amber);color:#fff}
  html[data-theme="dark"] .btn.amber{color:#fff}
  .btn svg{width:15px;height:15px}
  .btn-sm{
    border:1px solid var(--rule);background:var(--surface);color:var(--ink-2);
    border-radius:16px;padding:5px 12px;font-size:12.5px;cursor:pointer;transition:all .15s;
  }
  .btn-sm:hover{border-color:var(--ink-2);color:var(--ink)}
  .btn-sm.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn-group{display:flex;gap:8px;flex-wrap:wrap}
  .row-btns{display:flex;gap:8px;margin-top:8px}
  .spin{
    display:inline-block;width:13px;height:13px;border-radius:50%;
    border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .tag,.tag-chip{
    display:inline-flex;align-items:center;max-width:170px;
    font-family:var(--font-ui);font-size:12.5px;font-weight:400;
    color:var(--ink-2);background:var(--surface-2);
    padding:4px 11px;border-radius:14px;border:none;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  a.tag-chip,button.tag-chip{cursor:pointer;transition:background .15s,color .15s,transform .18s var(--ease)}
  a.tag-chip:hover,button.tag-chip:hover,.tag:hover{background:var(--accent-soft);color:var(--accent-ink)}
  a.tag-chip:active,button.tag-chip:active{transform:scale(.96)}

  /* The darker accent washes up from the bottom of the button instead of the
     whole face switching colour at once. One gradient, no extra element and
     no script: the button paints a two stop gradient at twice its own height
     and slides the window down it on hover. */
  .btn:not(.ghost):not(.danger){
    background-image:linear-gradient(to top,var(--accent-hover) 50%,var(--accent) 50%);
    background-size:100% 202%;background-position:0 0;
    transition:background-position .3s var(--ease),border-color .16s var(--ease),color .16s var(--ease),opacity .16s var(--ease);
  }
  .btn:not(.ghost):not(.danger):hover{background-position:0 100%;border-color:var(--accent-hover)}
  .tag-more{font-size:12px;color:var(--muted);padding:4px 4px}
  .pinned-badge{
    font-family:var(--font-ui);font-size:11.5px;font-weight:500;color:var(--amber);
  }
  .dot-sep{color:var(--muted)}

  .show-more{display:flex;justify-content:center;margin:32px 0 0}
  .show-more button{
    border:1px solid var(--rule);background:transparent;color:var(--ink-2);
    font-family:var(--font-ui);font-size:13.5px;padding:9px 22px;border-radius:20px;cursor:pointer;
    transition:all .16s var(--ease);
  }
  .show-more button:hover{border-color:var(--ink-2);color:var(--ink)}
  .show-more-inline{
    background:none;border:none;padding:8px 0 0;cursor:pointer;
    font-family:var(--font-ui);font-size:13px;color:var(--accent);
  }
  .show-more-inline:hover{text-decoration:underline}

  .sec-head{display:flex;align-items:baseline;gap:12px;margin:0 0 18px}
  .sec-head h2{font-size:17px;font-weight:600;letter-spacing:-.01em}
  .sec-head .sec-note{font-size:13px;color:var(--muted);margin-left:auto}

  /* ==========================================================================
     HOME MASTHEAD
     ========================================================================== */
  .masthead{padding:8px 0 30px;margin-bottom:8px;border-bottom:1px solid var(--rule)}
  .masthead h1{
    font-size:clamp(38px,6vw,56px);font-weight:600;letter-spacing:-.045em;line-height:1;margin-bottom:14px;
  }
  .masthead .mh-sub{
    font-family:var(--font-read);font-size:20px;line-height:1.5;color:var(--ink-2);max-width:560px;margin:0 0 18px;
  }
  .masthead .mh-kicker{display:none}
  .masthead .mh-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}

  /* home feed toolbar (topic pills, Medium style) */
  .feed-tabs{
    display:flex;align-items:center;gap:10px;overflow-x:auto;scrollbar-width:none;
    padding:14px 0 12px;border-bottom:1px solid var(--rule);margin-bottom:6px;
  }
  .feed-tabs::-webkit-scrollbar{display:none}
  .feed-tabs button{
    border:none;background:none;cursor:pointer;white-space:nowrap;color:var(--ink-2);
    font-size:14px;padding:6px 2px;border-bottom:1px solid transparent;transition:color .15s;
  }
  .feed-tabs button:hover{color:var(--ink)}
  .feed-tabs button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}

  /* ==========================================================================
     FEED CARDS
     ========================================================================== */
  /* The card behaves like the project cards on rafiarsya.com: it lifts off the
     page on hover, a details strip fades up from under the meta line, and the
     cover dims behind a button that slides into place. The strip's space is
     reserved permanently (padding-bottom), so nothing below the pointer ever
     jumps while you read down the list. */
  .post-card{
    position:relative;
    display:grid;grid-template-columns:minmax(0,1fr) 168px;gap:26px;align-items:start;
    padding:22px 16px 40px;margin:0 -16px;border-radius:14px;cursor:pointer;
    background:transparent;
    transition:transform .4s cubic-bezier(.4,0,.2,1),box-shadow .4s cubic-bezier(.4,0,.2,1),
               background .4s cubic-bezier(.4,0,.2,1);
  }
  /* the rule between rows is drawn inset, so the hover surface can be rounded */
  .post-card::after{
    content:"";position:absolute;left:16px;right:16px;bottom:0;height:1px;
    background:var(--rule-2);transition:opacity .3s var(--ease);
  }
  .post-card:hover{
    transform:translateY(-6px) scale(1.012);
    box-shadow:var(--shadow-lg);
    background:var(--surface);
  }
  html[data-theme="dark"] .post-card:hover{background:var(--surface-2)}
  .post-card:hover::after{opacity:0}
  .pc-body{position:relative;min-width:0;order:1}
  .pc-thumb-wrap{
    order:2;position:relative;width:168px;height:112px;border-radius:6px;overflow:hidden;
    background:var(--surface-2);flex-shrink:0;
  }
  img.pc-thumb,div.pc-thumb{
    width:100%;height:100%;object-fit:cover;display:block;background:var(--surface-2);
    transition:transform .5s cubic-bezier(.4,0,.2,1);
  }
  .post-card:hover img.pc-thumb{transform:scale(1.06)}
  div.pc-thumb{display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:26px;color:var(--muted)}
  .pc-overlay{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:color-mix(in srgb,var(--bg) 84%,transparent);
    opacity:0;pointer-events:none;transition:opacity .3s var(--ease);
  }
  .post-card:hover .pc-overlay{opacity:1}
  .pc-overlay-btn{
    background:var(--accent-soft);color:var(--accent-ink);border:1px solid var(--accent);
    padding:6px 15px;border-radius:20px;font-family:var(--font-ui);font-size:12.5px;font-weight:600;
    white-space:nowrap;transform:translateY(18px);transition:transform .3s var(--ease);
  }
  html[data-theme="dark"] .pc-overlay-btn{color:var(--accent)}
  .post-card:hover .pc-overlay-btn{transform:none}
  .pc-details{
    position:absolute;left:16px;right:16px;bottom:11px;
    display:flex;align-items:center;flex-wrap:wrap;gap:6px;
    opacity:0;transform:translateY(10px);pointer-events:none;
    transition:opacity .3s var(--ease),transform .4s cubic-bezier(.4,0,.2,1);
  }
  .post-card:hover .pc-details{opacity:1;transform:none}
  .pc-details .pc-details-rule{
    position:absolute;left:0;right:0;top:-13px;height:1px;background:var(--rule-2);
  }
  .pc-details .tag-chip{font-size:12px;padding:3px 10px}
  /* the collapsed "+N" is exactly what the strip expands, so it steps aside */
  .post-meta .tag-more{transition:opacity .25s var(--ease)}
  .post-card:hover .post-meta .tag-more{opacity:0}
  .pc-byline{display:flex;align-items:center;gap:8px;margin-bottom:9px;font-size:13px;color:var(--ink-2)}
  .pc-avatar{
    width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;
  }
  html[data-theme="dark"] .pc-avatar{color:var(--accent)}
  .post-title{
    font-family:var(--font-display);font-size:21px;font-weight:600;line-height:1.28;letter-spacing:-.02em;
    margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .post-card:hover .post-title{color:var(--accent)}
  .post-excerpt{
    font-family:var(--font-read);font-size:16px;line-height:1.5;color:var(--ink-2);margin:0 0 12px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .post-meta{
    display:flex;align-items:center;flex-wrap:wrap;gap:10px;
    font-size:12.5px;color:var(--muted);
  }
  .bookmark-btn{
    border:none;background:none;cursor:pointer;color:var(--muted);padding:4px;border-radius:6px;
    display:inline-flex;margin-left:auto;transition:color .15s;
  }
  .bookmark-btn svg{width:17px;height:17px}
  .bookmark-btn:hover{color:var(--ink)}
  .bookmark-btn.saved{color:var(--accent)}
  .bookmark-btn.inline{position:static;flex-shrink:0}
  .bookmark-btn.pop{animation:bookmarkPop .34s var(--ease)}
  @keyframes bookmarkPop{0%{transform:scale(1)}35%{transform:scale(1.3)}100%{transform:scale(1)}}
  .bookmarks-empty{padding:50px 0;text-align:center;color:var(--muted)}

  /* featured (first post on the home feed) */
  .hero-row{display:block;margin-bottom:8px}
  .hero-post{display:block;cursor:pointer;padding:4px 0 30px;border-bottom:1px solid var(--rule)}
  .hero-post .hero-img{
    width:100%;aspect-ratio:2/1;object-fit:cover;display:block;border-radius:6px;
    background:var(--surface-2);margin-bottom:22px;
  }
  .hero-post div.hero-img{display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:48px;color:var(--muted)}
  .hero-content{padding:0}
  .hero-eyebrow{font-size:12.5px;font-weight:500;color:var(--accent);margin-bottom:10px;letter-spacing:.02em}
  .hero-title{
    font-family:var(--font-display);font-size:clamp(28px,4vw,36px);font-weight:600;
    line-height:1.16;letter-spacing:-.032em;margin-bottom:12px;
  }
  .hero-post:hover .hero-title{text-decoration:underline;text-underline-offset:4px}
  .hero-excerpt{
    font-family:var(--font-read);font-size:18px;line-height:1.55;color:var(--ink-2);margin-bottom:14px;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  }
  .hero-meta{font-size:13px;color:var(--muted)}

  /* "latest" strip is now a compact list under the featured post */
  .latest-panel{display:none}

  /* ==========================================================================
     RECOMMENDATIONS
     ========================================================================== */
  .rec-section{margin:0 0 44px}
  .rec-head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .rec-head h2{font-size:17px;font-weight:600}
  .rec-why{font-size:13px;color:var(--muted);margin:0 0 16px}
  .rec-list{display:flex;flex-direction:column}
  .rec-item{
    display:grid;grid-template-columns:24px minmax(0,1fr);gap:14px;align-items:start;
    padding:14px 0;border-bottom:1px solid var(--rule-2);cursor:pointer;
  }
  .rec-item:last-child{border-bottom:none}
  .rec-n{font-family:var(--font-mono);font-size:14px;color:var(--rule);font-weight:600;padding-top:2px}
  html[data-theme="dark"] .rec-n{color:#3a362f}
  .rec-title{
    font-family:var(--font-display);font-size:16px;font-weight:600;line-height:1.32;margin-bottom:4px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .rec-item:hover .rec-title{text-decoration:underline;text-underline-offset:3px}
  .rec-meta{font-size:12.5px;color:var(--muted)}
  .rec-tag{color:var(--accent)}

  /* start here (3 cards) */
  .start-here{margin:0 0 44px}
  .sh-heading{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:17px;font-weight:600;font-family:var(--font-display)}
  .sh-badge{
    font-size:11.5px;font-weight:500;color:var(--accent-ink);background:var(--accent-soft);
    padding:3px 10px;border-radius:12px;
  }
  html[data-theme="dark"] .sh-badge{color:var(--accent)}
  .sh-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
  .sh-card{cursor:pointer;padding-top:14px;border-top:2px solid var(--ink)}
  html[data-theme="dark"] .sh-card{border-top-color:var(--ink-2)}
  .sh-label{font-size:11.5px;font-weight:500;color:var(--accent);margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em}
  .sh-title{
    font-family:var(--font-display);font-size:16px;font-weight:600;line-height:1.3;margin-bottom:6px;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  }
  .sh-card:hover .sh-title{text-decoration:underline;text-underline-offset:3px}
  .sh-note{font-family:var(--font-read);font-size:14.5px;color:var(--muted);line-height:1.45}

  /* most read */
  .top-rated{margin:0 0 44px}
  .tr-heading{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:17px;font-weight:600;font-family:var(--font-display)}
  .tr-badge{font-size:11.5px;font-weight:500;color:var(--amber);background:var(--amber-soft);padding:3px 10px;border-radius:12px}
  .tr-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
  .tr-card{position:relative;cursor:pointer;padding-left:30px}
  .tr-rank{
    position:absolute;left:0;top:-4px;font-family:var(--font-display);font-size:24px;font-weight:600;
    color:var(--rule);letter-spacing:-.04em;
  }
  html[data-theme="dark"] .tr-rank{color:#332f28}
  img.tr-thumb,div.tr-thumb{display:none}
  .tr-body{min-width:0}
  .tr-title{
    font-family:var(--font-display);font-size:15px;font-weight:600;line-height:1.3;margin-bottom:5px;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  }
  .tr-card:hover .tr-title{text-decoration:underline;text-underline-offset:3px}
  .tr-views{font-size:12.5px;color:var(--muted)}

  /* topics */
  .topic-section{margin:0 0 44px}
  .topic-heading{font-family:var(--font-display);font-size:17px;font-weight:600;margin-bottom:4px}
  .topic-sub{font-size:13.5px;color:var(--muted);margin-bottom:16px}
  .topic-grid{display:flex;flex-wrap:wrap;gap:10px}
  .topic-tile{
    cursor:pointer;border:1px solid var(--rule);border-radius:20px;padding:8px 16px;
    background:transparent;transition:all .16s var(--ease);display:flex;align-items:baseline;gap:8px;
  }
  .topic-tile:hover{border-color:var(--ink-2);background:var(--surface-2)}
  .tt-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
  .tt-count{font-size:12px;color:var(--muted)}

  /* sponsor */
  .sponsor-card{
    display:flex;align-items:flex-start;gap:14px;margin:0 0 44px;padding:18px 20px;
    border:1px solid var(--rule);border-radius:var(--radius);background:var(--surface-2);
  }
  .sponsor-card.inline{margin:36px 0}
  .sp-mark{
    width:40px;height:40px;border-radius:8px;flex-shrink:0;background:var(--surface);
    border:1px solid var(--rule);display:flex;align-items:center;justify-content:center;font-size:20px;
    overflow:hidden;
  }
  .sp-mark img{width:100%;height:100%;object-fit:cover}
  .sp-body{flex:1;min-width:0}
  .sp-label{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .sp-name{font-family:var(--font-display);font-size:15.5px;font-weight:600;margin-bottom:3px}
  .sp-text{font-size:14px;color:var(--ink-2);line-height:1.5;margin:0}
  .sp-cta{
    flex-shrink:0;align-self:center;text-decoration:none;font-size:13.5px;font-weight:500;color:var(--accent);
    border:1px solid var(--rule);border-radius:18px;padding:7px 15px;transition:all .15s;white-space:nowrap;
  }
  .sp-cta:hover{border-color:var(--accent);background:var(--accent-soft)}

  /* newsletter */
  .nl-bar{
    margin:44px 0 0;padding:28px;border:1px solid var(--rule);border-radius:var(--radius);
    background:var(--surface-2);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,320px);
    gap:24px;align-items:center;
  }
  .nl-text h3{font-family:var(--font-display);font-size:18px;font-weight:600;margin-bottom:5px}
  .nl-text p{font-size:14.5px;color:var(--ink-2);margin:0;line-height:1.5}
  .nl-form{display:flex;gap:8px}
  .nl-form input{
    flex:1;min-width:0;border:1px solid var(--rule);background:var(--surface);border-radius:20px;
    padding:10px 16px;font-size:14px;outline:none;transition:border-color .15s;
  }
  .nl-form input:focus{border-color:var(--accent)}
  .nl-form button{
    border:1px solid var(--accent);background:var(--accent);color:#fff;font-weight:500;font-size:13.5px;
    padding:10px 18px;border-radius:20px;cursor:pointer;white-space:nowrap;
  }
  html[data-theme="dark"] .nl-form button{color:#131211}

  /* search */
  .search-row{
    position:relative;display:flex;align-items:center;margin:0 0 10px;
    border:1px solid var(--rule);border-radius:24px;background:var(--surface-2);
    transition:border-color .18s var(--ease);
  }
  .search-row:focus-within{border-color:var(--ink-2);background:var(--surface)}
  .search-row .search-icon{display:flex;padding:0 6px 0 16px;color:var(--muted)}
  .search-row .search-icon svg{width:17px;height:17px}
  .search-row input{flex:1;min-width:0;border:none;background:none;outline:none;padding:11px 10px;font-size:14.5px}
  .search-row input::placeholder{color:var(--muted)}
  .search-row .search-spinner{opacity:0;padding-right:14px;color:var(--accent);display:flex;transition:opacity .2s}
  .search-row .search-spinner.show{opacity:1}
  .search-row .search-spinner svg{width:16px;height:16px;animation:spin .8s linear infinite}
  .search-clear{border:none;background:none;cursor:pointer;color:var(--muted);padding:6px;margin-right:8px;display:flex;border-radius:50%}
  .search-clear svg{width:14px;height:14px}
  .search-clear:hover{background:var(--rule-2);color:var(--ink)}
  .search-hint{min-height:18px;margin:0 0 18px;padding-left:16px;font-size:12.5px;color:var(--muted)}
  .search-hint.warn{color:var(--danger)}
  .search-row.locked{border-color:var(--danger)}
  .tagcloud{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 24px}
  .tagcloud button{
    border:1px solid var(--rule);background:transparent;color:var(--ink-2);
    font-size:13px;padding:6px 14px;border-radius:18px;cursor:pointer;
    max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all .15s;
  }
  .tagcloud button:hover{border-color:var(--ink-2);color:var(--ink)}
  .tagcloud button .tc-n{color:var(--muted);margin-left:6px}

  /* ==========================================================================
     ARTICLE
     ========================================================================== */
  .crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:20px;font-size:13px;color:var(--muted)}
  .crumbs a{cursor:pointer;text-decoration:none;transition:color .15s}
  .crumbs a:hover{color:var(--ink)}
  .crumbs .sep{opacity:.5}
  .crumbs .here{max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .back-link{
    display:inline-flex;align-items:center;gap:7px;border:none;background:none;cursor:pointer;
    padding:0;margin-bottom:24px;font-size:13.5px;color:var(--muted);
  }
  .back-link svg{width:15px;height:15px}
  .back-link:hover{color:var(--ink)}

  .post .post-title{
    font-family:var(--font-display);font-size:clamp(30px,5vw,42px);font-weight:600;
    line-height:1.15;letter-spacing:-.035em;margin:0 0 10px;
    display:block;-webkit-line-clamp:unset;overflow:visible;
  }
  .post-card:hover .post-title,.post .post-title{text-decoration:none}
  .article-subtitle{
    font-family:var(--font-read);font-size:21px;line-height:1.45;color:var(--muted);margin:0 0 24px;
  }
  .post .post-meta{margin:0 0 20px}
  .cover{
    width:100%;aspect-ratio:2/1;object-fit:cover;display:block;margin:28px 0 10px;
    background:var(--surface-2);border-radius:4px;
  }
  .cover.ratio-wide{aspect-ratio:21/9}
  .cover.ratio-tall{aspect-ratio:4/3}
  .cover-caption{font-size:12.5px;color:var(--muted);text-align:center;margin-bottom:26px}

  .byline{
    display:flex;align-items:center;gap:12px;margin:26px 0;padding:20px 0;
    border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  }
  .bl-avatar{
    width:44px;height:44px;border-radius:50%;flex-shrink:0;background:var(--accent-soft);color:var(--accent-ink);
    display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:18px;font-weight:600;
  }
  html[data-theme="dark"] .bl-avatar{color:var(--accent)}
  .bl-name{font-size:15px;font-weight:500}
  .bl-sub{font-size:13px;color:var(--muted)}
  .bl-follow{margin-left:auto}
  .bl-actions{margin-left:auto;display:flex;align-items:center;gap:4px}

  .toc{
    margin:26px 0;border:1px solid var(--rule);border-radius:var(--radius);background:var(--surface-2);padding:2px 20px;
  }
  .toc summary{
    cursor:pointer;padding:14px 0;list-style:none;font-size:13px;font-weight:500;color:var(--ink-2);
  }
  .toc summary::-webkit-details-marker{display:none}
  .toc summary::after{content:"⌄";float:right;transform:translateY(-4px)}
  .toc[open] summary::after{content:"⌃";transform:translateY(4px)}
  .toc ol{list-style:none;margin:0;padding:0 0 14px;counter-reset:toc}
  .toc li{counter-increment:toc;padding:5px 0}
  .toc li.lvl3{padding-left:18px}
  .toc a{text-decoration:none;color:var(--ink-2);font-size:14px;line-height:1.4;display:block}
  .toc a::before{content:counter(toc) ". ";color:var(--muted)}
  .toc a:hover{color:var(--accent)}

  /* the reading surface */
  .post-body{
    font-family:var(--font-read);
    font-size:calc(21px * var(--reader-fs));
    line-height:1.58;letter-spacing:-.003em;color:var(--ink);margin-top:26px;
  }
  body[data-reader-font="sans"] .post-body{font-family:var(--font-ui);font-size:calc(18px * var(--reader-fs));line-height:1.7}
  .post-body p{margin:0 0 1.4em}
  .post-body h2{
    font-family:var(--font-display);font-size:calc(28px * var(--reader-fs));font-weight:600;
    letter-spacing:-.028em;margin:1.9em 0 .5em;line-height:1.24;scroll-margin-top:80px;
  }
  .post-body h3{
    font-family:var(--font-display);font-size:calc(22px * var(--reader-fs));font-weight:600;
    letter-spacing:-.02em;margin:1.7em 0 .45em;scroll-margin-top:80px;
  }
  .post-body a{color:var(--ink);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
  .post-body a:hover{color:var(--accent)}
  .post-body ul,.post-body ol{margin:0 0 1.4em;padding-left:1.3em}
  .post-body li{margin-bottom:.6em;padding-left:.2em}
  .post-body blockquote{
    margin:1.6em 0;padding:2px 0 2px 22px;border-left:3px solid var(--ink);
    font-style:italic;color:var(--ink-2);
  }
  html[data-theme="dark"] .post-body blockquote{border-left-color:var(--ink-2)}
  .post-body blockquote p:last-child{margin-bottom:0}
  .post-body img{display:block;margin:2em auto;border-radius:3px;cursor:zoom-in}
  .post-body img.img-size-small{max-width:340px}
  .post-body img.img-size-medium{max-width:540px}
  .post-body img.img-size-full{max-width:100%}
  .post-body hr{border:none;height:0;margin:2.6em 0;text-align:center}
  .post-body hr::before{content:"• • •";color:var(--muted);letter-spacing:.6em;font-size:14px}
  .post-body mark{background:var(--amber-soft);color:inherit;padding:1px 3px;border-radius:2px}
  .post-body table{width:100%;border-collapse:collapse;margin:1.6em 0;font-family:var(--font-ui);font-size:14.5px}
  .post-body th,.post-body td{border:1px solid var(--rule);padding:9px 12px;text-align:left}
  .post-body th{background:var(--surface-2);font-weight:600}
  .post-body figure{margin:2em 0}
  .post-body figcaption{font-size:13px;color:var(--muted);text-align:center;margin-top:8px}
  .post-body code{
    font-family:var(--font-mono);font-size:.78em;background:var(--surface-2);
    padding:2px 6px;border-radius:3px;
  }
  .post-body sup a{font-family:var(--font-mono);font-size:11px;text-decoration:none}
  .footnotes{margin-top:3em;padding-top:1.4em;border-top:1px solid var(--rule);font-size:.8em;color:var(--ink-2)}
  .footnotes .fn-title{font-family:var(--font-ui);font-size:13px;font-weight:600;margin-bottom:8px}
  .footnotes ol{padding-left:1.2em}

  .code-wrap{margin:2em 0;border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--surface-2)}
  .code-head{
    display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 12px;
    border-bottom:1px solid var(--rule);
  }
  .code-lang{font-family:var(--font-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .code-copy{
    display:inline-flex;align-items:center;gap:6px;border:none;background:none;color:var(--muted);
    font-family:var(--font-ui);font-size:12px;padding:3px 8px;border-radius:12px;cursor:pointer;transition:all .15s;
  }
  .code-copy svg{width:12px;height:12px}
  .code-copy:hover{color:var(--ink);background:var(--rule-2)}
  .code-copy.copied{color:var(--accent)}
  .code-wrap pre{margin:0;padding:16px;overflow-x:auto}
  .post-body pre code{background:none;padding:0;font-size:13.5px;line-height:1.6;color:var(--ink)}
  .hljs-comment,.hljs-quote{color:var(--muted);font-style:italic}
  .hljs-keyword,.hljs-selector-tag,.hljs-built_in{color:var(--accent);font-weight:600}
  .hljs-string,.hljs-attr,.hljs-number{color:var(--amber)}
  .hljs-title,.hljs-name,.hljs-function{color:var(--ink);font-weight:600}

  .callout{
    margin:1.8em 0;padding:16px 20px;border-radius:6px;border-left:3px solid var(--accent);
    background:var(--surface-2);font-family:var(--font-read);font-size:.9em;
  }
  .callout-head{
    display:flex;align-items:center;gap:8px;margin-bottom:6px;
    font-family:var(--font-ui);font-size:12px;font-weight:600;letter-spacing:.04em;
    text-transform:uppercase;color:var(--accent);
  }
  .callout-head svg{width:14px;height:14px}
  .callout p:last-child{margin-bottom:0}
  .callout.warn{border-left-color:var(--amber)}
  .callout.warn .callout-head{color:var(--amber)}

  .embed{position:relative;margin:2em 0;border-radius:6px;overflow:hidden;border:1px solid var(--rule)}
  .embed iframe{display:block;width:100%;aspect-ratio:16/9;border:none}
  .embed-codepen iframe{aspect-ratio:4/3}

  .series-box{margin:26px 0 0;border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden}
  .series-box-head{
    display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 18px;
    border-bottom:1px solid var(--rule);background:var(--surface-2);
  }
  .series-box-label{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--accent);letter-spacing:.04em;text-transform:uppercase}
  .series-box-label svg{width:13px;height:13px}
  .series-box-progress{font-size:12.5px;color:var(--muted)}
  .series-box-title{font-family:var(--font-display);font-size:16px;font-weight:600;padding:14px 18px 6px}
  .series-box-list{padding:0 8px 8px}
  .series-box-item{
    display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:6px;cursor:pointer;
    text-decoration:none;color:inherit;transition:background .15s;
  }
  .series-box-item:hover{background:var(--surface-2)}
  .series-box-item.current{background:var(--accent-soft);cursor:default}
  .sbi-num{
    font-family:var(--font-mono);font-size:11px;color:var(--muted);width:20px;height:20px;flex-shrink:0;
    border:1px solid var(--rule);border-radius:50%;display:flex;align-items:center;justify-content:center;
  }
  .series-box-item.current .sbi-num{border-color:var(--accent);color:var(--accent)}
  .sbi-title{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sbi-here{font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}

  /* claps row, share, reactions */
  .share-row{
    display:flex;align-items:center;gap:10px;margin:36px 0 0;padding:16px 0;
    border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  }
  .share-row .lbl{font-size:13.5px;color:var(--muted);margin-right:auto}
  .share-btn{
    width:34px;height:34px;border:none;border-radius:50%;background:transparent;color:var(--muted);
    cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;transition:all .15s;
  }

  /* ==========================================================================
     BACKGROUND COLLAGE + READING SHEET
     The photographs live behind everything and are only ever visible around
     the edges of the sheet, which is opaque. No line of text sits on a photo.
     The images are attached by JS, and only on wide screens, so a phone never
     downloads a megabyte of decoration it cannot see.
     ========================================================================== */
  /* Two gutter columns, three tiles each. The tiles are small enough that a
     whole photograph fits inside one, which is the difference between a
     collage and a smear. Nothing renders until the window is wide enough for
     a gutter to exist at all. */
  .bg-collage{
    position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
    display:flex;justify-content:space-between;
  }
  .bgc-col{
    width:calc((100vw - 1240px) / 2);
    display:grid;grid-template-rows:repeat(3,1fr);gap:10px;padding:10px;
  }
  .bgc-col span{
    background-size:cover;background-position:center;border-radius:8px;
    opacity:0;transition:opacity .9s var(--ease);
    filter:saturate(.62);
  }
  .bgc-col.on span,.bg-collage.on .bgc-col span{opacity:.42}
  html[data-theme="dark"] .bg-collage.on .bgc-col span{opacity:.22;filter:saturate(.4) brightness(.7)}
  /* a fade toward the sheet so the edge never reads as a hard seam */
  .bg-collage::before,.bg-collage::after{
    content:"";position:absolute;top:0;bottom:0;width:calc((100vw - 1240px) / 2 + 40px);
    pointer-events:none;z-index:1;
  }
  .bg-collage::before{left:0;background:linear-gradient(90deg,color-mix(in srgb,var(--bg) 55%,transparent),var(--bg))}
  .bg-collage::after{right:0;background:linear-gradient(270deg,color-mix(in srgb,var(--bg) 55%,transparent),var(--bg))}
  /* Below this width there is no gutter worth filling. */
  @media (max-width:1460px){.bg-collage{display:none}}

  .sheet{
    position:relative;z-index:1;max-width:1240px;margin:0 auto;min-height:100vh;
    background:var(--bg);
    box-shadow:0 0 0 1px color-mix(in srgb,var(--rule) 70%,transparent),0 22px 70px rgba(40,34,22,.14);
  }
  html[data-theme="dark"] .sheet{box-shadow:0 0 0 1px var(--rule),0 22px 70px rgba(0,0,0,.5)}
  /* the sticky header lives inside the sheet, so it needs the sheet's width */
  .sheet header.site{background:color-mix(in srgb,var(--bg) 92%,transparent)}

  /* the logo, with the drawn square as a fallback if the file is missing */
  img.brand-mark{border-radius:7px;display:block;background:none}
  .brand-mark-fallback{
    width:28px;height:28px;border-radius:7px;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;
  }

  /* ---------- photographic accents ---------- */
  /* About page: one image at the top, cropped wide so it reads as a header. */
  .page-photo{
    width:100%;aspect-ratio:3/1;object-fit:cover;display:block;border-radius:6px;
    margin:0 0 26px;background:var(--surface-2);
  }
  /* Newsletter box: the same journal photo, faded into the right edge. */
  .nl-bar{position:relative;overflow:hidden}
  .nl-bar::after{
    content:"";position:absolute;right:0;top:0;bottom:0;width:38%;pointer-events:none;
    background-image:var(--nl-photo,none);background-size:cover;background-position:center;
    opacity:.16;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 55%);
    mask-image:linear-gradient(90deg,transparent,#000 55%);
  }
  .nl-bar>*{position:relative;z-index:1}
  /* Empty states get a soft banner rather than a bare line of grey text. */
  .empty-photo{
    width:100%;max-width:420px;aspect-ratio:5/2;object-fit:cover;border-radius:6px;
    margin:0 auto 18px;display:block;opacity:.75;
  }

<script>
const TL_BUILD="2026-09-07-v9.0-nalar";console.log("%cNalar build: "+TL_BUILD,"color:#4e6b35;font-weight:bold");
const app=document.getElementById("app"),nav=document.getElementById("nav"),toastEl=document.getElementById("toast");
let me=null;
let currentController=null;

function go(p){if(document.getElementById("navDrawer")?.classList.contains("open"))closeNavDrawer();history.pushState({},"",p);route()}
window.onpopstate=route;

function showToast(msg,isError){
  toastEl.textContent=msg;
  toastEl.className="toast show"+(isError?" error-toast":"");
  clearTimeout(toastEl._t);
  toastEl._t=setTimeout(()=>toastEl.classList.remove("show"),3200);
}

async function api(path,opts={},signal){
  const ctrl=new AbortController();
  const timeout=setTimeout(()=>ctrl.abort("timeout"),10000);
  const onParentAbort=()=>ctrl.abort("navigated-away");
  if(signal){
    if(signal.aborted)onParentAbort();
    else signal.addEventListener("abort",onParentAbort);
  }
  try{
    const r=await fetch("/api"+path,{headers:opts.body instanceof FormData?{}:{"Content-Type":"application/json"},...opts,signal:ctrl.signal});
    if(!r.ok){
      let payload;
      try{payload=await r.json()}catch{payload={error:`Server error (${r.status})`}}
      throw payload;
    }
    return await r.json();
  }catch(e){
    if(e?.name==="AbortError"||ctrl.signal.aborted){
      if(ctrl.signal.reason==="timeout")throw{error:"Request timed out, the server took too long to respond."};
      throw{error:"cancelled"};
    }
    throw e?.error?e:{error:"Network error, check your connection and try again."};
  }finally{
    clearTimeout(timeout);
    if(signal)signal.removeEventListener("abort",onParentAbort);
  }
}

function fmtDate(ts){return new Date(ts).toLocaleDateString("en-US",{year:"numeric",month:"short",day:"numeric"})}
// 1284937 -> "1,284,937". Grouped digits read faster and, with tabular
// numerals in the CSS, keep stat cards a predictable width.
function fmtNum(n){return Number(n||0).toLocaleString("en-US")}
// Compact form for tight spots like chart bar labels: 1284937 -> "1.3M".
function fmtCompact(n){
  n=Number(n||0);
  if(n<1000)return String(n);
  if(n<1e6)return (n/1e3).toFixed(n<1e4?1:0).replace(/\.0$/,"")+"k";
  return (n/1e6).toFixed(n<1e7?1:0).replace(/\.0$/,"")+"M";
}
function fmtDateTime(ts){return new Date(ts).toLocaleString("en-US",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}
// Relative time like "just now", "5m ago", "3h ago", "2d ago"; falls back to a
// full date past a week. The full timestamp goes in the title attribute.
function timeAgo(ts){
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<45)return"just now";
  if(s<90)return"1m ago";
  const m=Math.floor(s/60); if(m<60)return m+"m ago";
  const h=Math.floor(m/60); if(h<24)return h+"h ago";
  const d=Math.floor(h/24); if(d<7)return d+"d ago";
  return fmtDate(ts);
}
// Anonymous comment ownership: when you post a comment the server hands back a
// one-time edit token; we keep it here, keyed by comment id, so the same
// browser can later edit or delete that comment. Cleared if you clear storage.
const COMMENT_TOKENS_KEY="tl_comment_tokens";
function getCommentTokens(){try{return JSON.parse(localStorage.getItem(COMMENT_TOKENS_KEY)||"{}")}catch{return{}}}
function saveCommentToken(id,token){const t=getCommentTokens();t[id]=token;localStorage.setItem(COMMENT_TOKENS_KEY,JSON.stringify(t))}
function tokenFor(id){return getCommentTokens()[id]||null}
function dropCommentToken(id){const t=getCommentTokens();delete t[id];localStorage.setItem(COMMENT_TOKENS_KEY,JSON.stringify(t))}
function esc(s){const d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML}
// Escapes a value for safe use inside a single-quoted JS string that itself
// sits inside an HTML attribute (onclick="go('…')"). esc() alone is not enough:
// a tag containing an apostrophe or backslash would break out of the string.
// Everything user-controlled that ends up in an inline handler goes through this.
function jsq(s){
  return String(s==null?"":s)
    .replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/"/g,"&quot;")
    .replace(/</g,"\\u003c").replace(/>/g,"\\u003e")
    .replace(/\r?\n/g,"\\n");
}
// Hard cap on any label that renders in a chip, crumb or card so one very long
// word can never blow out a layout. CSS truncates visually; this truncates the
// string itself, which also keeps titles/tooltips sane.
function clip(s,n){
  s=String(s==null?"":s);
  return s.length>n?s.slice(0,n-1).trimEnd()+"…":s;
}
// Tag chips for a card: at most `max` of them, each clipped, with a "+N" pill
// standing in for the rest. Keeps every card the same visual height.
function tagChips(tags,max=2,clickable=true){
  if(!Array.isArray(tags)||!tags.length)return "";
  const shown=tags.slice(0,max);
  const rest=tags.length-shown.length;
  const chips=shown.map(t=>clickable
    ? `<button type="button" class="tag-chip" title="${esc(t)}" onclick="event.stopPropagation();go('/tag/'+encodeURIComponent('${jsq(t)}'))">#${esc(clip(t,18))}</button>`
    : `<span class="tag-chip" title="${esc(t)}">#${esc(clip(t,18))}</span>`).join("");
  return chips+(rest>0?`<span class="tag-more" title="${esc(tags.slice(max).join(", "))}">+${rest}</span>`:"");
}

// ---- dark mode: persisted in localStorage, applied before first paint of
// each view via a data-attribute on <html> so CSS variables just work. ----
// Three reading themes, cycled from the header: paper (light) → sepia → night.
// The chosen one is applied to <html data-theme> before first paint by a tiny
// inline script in <head>, so there is never a flash of the wrong palette.
const THEMES=["light","sepia","dark"];
const THEME_META={
  light:{label:"Paper",next:"sepia"},
  sepia:{label:"Sepia",next:"dark"},
  dark:{label:"Night",next:"light"},
};
function getTheme(){
  const t=document.documentElement.getAttribute("data-theme");
  if(THEMES.includes(t))return t;
  try{const s=localStorage.getItem("tl_theme");if(THEMES.includes(s))return s}catch{}
  return "light";
}
function applyTheme(t){
  if(!THEMES.includes(t))t="light";
  document.documentElement.setAttribute("data-theme",t);
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.setAttribute("content",t==="dark"?"#181611":t==="sepia"?"#eee2cb":"#f6f2e9");
}
function setTheme(t){
  try{localStorage.setItem("tl_theme",t)}catch{}
  applyTheme(t);
  renderNav();
}
function toggleTheme(){
  const next=THEME_META[getTheme()].next;
  setTheme(next);
  showToast(`${THEME_META[next].label} mode`);
}
applyTheme(getTheme());

// ---- bookmarks / reading list: saved purely client-side (per-browser), ----
// keyed by slug so it survives independent of any account/login state.
function getBookmarks(){try{return JSON.parse(localStorage.getItem("tl_bookmarks")||"[]")}catch{return[]}}
function isBookmarked(slug){return getBookmarks().some(b=>b.slug===slug)}
function toggleBookmark(slug,title,btn){
  let list=getBookmarks();
  const idx=list.findIndex(b=>b.slug===slug);
  if(idx>-1){list.splice(idx,1)}
  else{list.unshift({slug,title,savedAt:Date.now()});if(list.length>200)list=list.slice(0,200)}
  localStorage.setItem("tl_bookmarks",JSON.stringify(list));
  renderNav();
  if(btn){
    btn.classList.toggle("saved",idx===-1);
    btn.innerHTML=idx===-1?ICONS.bookmarkFull:ICONS.bookmark;
    btn.classList.remove("pop");void btn.offsetWidth;btn.classList.add("pop");
  }
  return idx===-1;
}
function bookmarkBtn(slug,title,inline){
  const saved=isBookmarked(slug);
  return `<button class="bookmark-btn${saved?" saved":""}${inline?" inline":""}" data-slug="${esc(slug)}" data-title="${esc(title)}" title="${saved?"Remove from reading list":"Save to reading list"}" aria-label="Bookmark" onclick="event.stopPropagation();toggleBookmark(this.dataset.slug,this.dataset.title,this)">${saved?ICONS.bookmarkFull:ICONS.bookmark}</button>`;
}

// ---- "continue reading", remembers the last post opened so the reader ----
// can pick back up from the homepage without hunting for it.
function getLastRead(){try{return JSON.parse(localStorage.getItem("tl_last_read")||"null")}catch{return null}}
function setLastRead(slug,title){
  if(document.getElementById("resumeBanner")?.dataset.dismissed==="1")return;
  localStorage.setItem("tl_last_read",JSON.stringify({slug,title,at:Date.now()}));
}
function dismissResume(){
  localStorage.removeItem("tl_last_read");
  document.getElementById("resumeBanner")?.remove();
}
function resumeBannerHtml(currentSlug){
  const lr=getLastRead();
  if(!lr||lr.slug===currentSlug)return "";
  return `<div class="resume-banner" id="resumeBanner"><span class="rb-icon">${ICONS.reader}</span><div class="rb-text"><div class="rb-label">Continue reading</div><div class="rb-title">${esc(lr.title)}</div></div><button class="btn ghost small" onclick="go('/p/${lr.slug}')">Resume →</button><button class="rb-close" title="Dismiss" onclick="dismissResume()">${ICONS.close}</button></div>`;
}

let DEFAULT_COVER=null;
(function probeDefaultCover(){
  const img=new Image();
  img.onload=()=>{DEFAULT_COVER="/img/default-cover.jpg"};
  img.src="/img/default-cover.jpg";
})();
function coverOf(p){return p.coverImage||DEFAULT_COVER}
// Focal point: piggybacks on the same URL as a harmless query string
// (?focal=X,Y, plain static-file servers ignore it), so no backend/schema
// change is needed. Falls back to centered (50%,50%) if not set.
function coverPosition(p){
  const url=coverOf(p);
  if(!url)return "50% 50%";
  const m=url.match(/[?&]focal=([\d.]+),([\d.]+)/);
  return m?`${m[1]}% ${m[2]}%`:"50% 50%";
}
// Same trick, for the aspect ratio chosen in the editor (defaults to the
// base .cover style, a 16:9 "standard" crop, when nothing is set).
function coverRatioClass(p){
  const url=coverOf(p);
  if(!url)return "";
  const m=url.match(/[?&]ratio=(wide|standard|tall)/);
  return m&&m[1]!=="standard"?`ratio-${m[1]}`:"";
}

async function refreshMe(){try{me=await api("/me")}catch{me=null}renderNav()}
// Header links, the four places a reader actually wants to go. Everything
// else (reading list, series, now, about) lives in the footer and ⌘K, so the
// masthead stays uncrowded.
const NAV_LINKS=[
  {href:"/",label:"Home"},
  {href:"/archive",label:"Archive"},
  {href:"/series",label:"Series"},
  {href:"/about",label:"About"},
];
function navLinksHtml(){
  const p=location.pathname;
  return `<div class="nav-links">${NAV_LINKS.map(l=>{
    const on=l.href==="/"?p==="/":p.startsWith(l.href);
    return `<a href="${l.href}" class="${on?"on":""}" onclick="event.preventDefault();go('${l.href}')">${l.label}</a>`;
  }).join("")}</div>`;
}
function themeBtnHtml(){
  const t=getTheme();
  const icon=t==="dark"?ICONS.moon:t==="sepia"?ICONS.reader:ICONS.sun;
  return `<button class="nav-icon-btn" onclick="toggleTheme()" title="Reading theme: ${THEME_META[t].label} (click to switch)" aria-label="Switch reading theme">${icon}</button>`;
}
// ---------------------------------------------------------------------------
// MOBILE DRAWER
// Same links as the header, plus the things the header drops on a phone. Built
// once, re-rendered whenever the nav is, so the active link and the reading
// list count stay in step.
// ---------------------------------------------------------------------------
function mountNavDrawer(){
  if(document.getElementById("navDrawer"))return;
  document.body.insertAdjacentHTML("beforeend",`
    <div class="nav-drawer-scrim" id="navScrim" onclick="closeNavDrawer()"></div>
    <aside class="nav-drawer" id="navDrawer" role="dialog" aria-modal="true" aria-label="Menu" aria-hidden="true">
      <div class="nav-drawer-head">
        <span class="nav-drawer-title">Menu</span>
        <button class="nav-drawer-close" onclick="closeNavDrawer()" aria-label="Close menu">${ICONS.close}</button>
      </div>
      <div class="nav-drawer-links" id="navDrawerLinks"></div>
      <div class="nav-drawer-foot">Nalar, written and self hosted by Rafi Arsya.</div>
    </aside>`);
  document.addEventListener("keydown",(e)=>{
    if(e.key==="Escape"&&document.getElementById("navDrawer")?.classList.contains("open"))closeNavDrawer();
  });
}
function renderNavDrawer(){
  const box=document.getElementById("navDrawerLinks");
  if(!box)return;
  const p=location.pathname;
  const bCount=getBookmarks().length;
  const link=(href,label,icon)=>{
    const on=href==="/"?p==="/":p.startsWith(href);
    return `<a href="${href}" class="${on?"on":""}" onclick="event.preventDefault();closeNavDrawer();go('${href}')">${icon||""}<span>${label}</span></a>`;
  };
  box.innerHTML=
    NAV_LINKS.map(l=>link(l.href,l.label)).join("")
    +`<div class="nav-drawer-sep"></div>`
    +`<a href="/bookmarks" class="${p.startsWith("/bookmarks")?"on":""}" onclick="event.preventDefault();closeNavDrawer();go('/bookmarks')">${ICONS.bookmark}<span>Reading list</span>${bCount?`<span class="nav-drawer-count">${bCount>99?"99+":bCount}</span>`:""}</a>`
    +`<button type="button" onclick="closeNavDrawer();openCmdk()">${ICONS.search}<span>Search</span></button>`
    +(me
      ? `<div class="nav-drawer-sep"></div>`
        +link("/admin","Dashboard")
        +link("/write","Write")
        +`<button type="button" onclick="closeNavDrawer();logout()">Sign out</button>`
      : `<button type="button" onclick="closeNavDrawer();openSubModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span>Subscribe</span></button>`);
}
function openNavDrawer(){
  mountNavDrawer();
  renderNavDrawer();
  const d=document.getElementById("navDrawer"),sc=document.getElementById("navScrim");
  d.classList.add("open");sc.classList.add("open");
  d.setAttribute("aria-hidden","false");
  document.body.style.overflow="hidden";
  setTimeout(()=>d.querySelector(".nav-drawer-close")?.focus(),80);
}
function closeNavDrawer(){
  const d=document.getElementById("navDrawer"),sc=document.getElementById("navScrim");
  if(!d)return;
  d.classList.remove("open");sc?.classList.remove("open");
  d.setAttribute("aria-hidden","true");
  document.body.style.overflow="";
}

function renderNav(){
  const searchBtn=`<button class="nav-search-btn" onclick="openCmdk()" title="Search" aria-label="Search">${ICONS.search}<span class="full">Search</span><kbd>${navigator.platform.includes("Mac")?"⌘":"Ctrl"}K</kbd></button>`;
  const subBtn=`<button class="nav-sub" onclick="openSubModal()" title="Subscribe for updates"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span>Subscribe</span></button>`;
  const bCount=getBookmarks().length;
  const bookmarkBtnNav=`<button class="nav-bookmark-btn nav-icon-btn" onclick="go('/bookmarks')" title="Reading list${bCount?" ("+bCount+" saved)":""}" aria-label="Reading list">${ICONS.bookmark}${bCount?`<span class="nav-bookmark-badge">${bCount>99?"99+":bCount}</span>`:""}</button>`;
  // Reader-facing group first, account actions last. The nav links collapse on
  // small screens; search, theme and reading list stay reachable as icons.
  const menuBtn=`<button class="nav-icon-btn nav-menu-btn" onclick="openNavDrawer()" title="Menu" aria-label="Open menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>`;
  nav.innerHTML=navLinksHtml()+`<span class="nav-sep"></span>`+(me
    ?`${searchBtn}${themeBtnHtml()}${bookmarkBtnNav}<button class="nav-admin" onclick="go('/admin')"><span class="full">Dashboard</span><span class="short">⊞</span></button><button class="primary" onclick="go('/write')"><span class="full">Write</span><span class="short">✎</span></button><button class="nav-icon-btn nav-logout" onclick="logout()" title="Sign out" aria-label="Sign out">↩</button>`
    :`${searchBtn}${themeBtnHtml()}${bookmarkBtnNav}${subBtn}`)+menuBtn;
  renderNavDrawer();
}
async function logout(){try{await api("/logout",{method:"POST"})}catch{} me=null;renderNav();go("/")}


function errorBlock(msg){
  return `<div class="error">${ICONS.warn}<span>${esc(msg)}</span></div>`;

// ---------------------------------------------------------------------------
// READING HISTORY + RECOMMENDATIONS
// Everything here runs in the browser. There is no tracking on the server and
// no profile stored anywhere: the reader's own history lives in localStorage
// and never leaves the device. It is enough to do the useful part, which is
// noticing which topics somebody keeps opening and putting more of those in
// front of them.
// ---------------------------------------------------------------------------
const HISTORY_KEY="tl_history";
const HISTORY_MAX=40;
const HALF_LIFE_DAYS=21; // how fast an old read stops counting

function getHistory(){
  try{const h=JSON.parse(localStorage.getItem(HISTORY_KEY)||"[]");return Array.isArray(h)?h:[]}catch{return[]}
}
function recordRead(post){
  if(!post||!post.slug)return;
  let h=getHistory().filter(x=>x.slug!==post.slug);
  h.unshift({slug:post.slug,tags:Array.isArray(post.tags)?post.tags.slice(0,6):[],title:post.title,at:Date.now()});
  if(h.length>HISTORY_MAX)h=h.slice(0,HISTORY_MAX);
  try{localStorage.setItem(HISTORY_KEY,JSON.stringify(h))}catch{}
}
function clearHistory(){try{localStorage.removeItem(HISTORY_KEY)}catch{}}
// Each past read contributes to its tags, weighted by how recent it was.
// A post opened this morning counts about twice as much as one from three
// weeks ago, so the recommendations follow what you are into lately.
function tagAffinity(){
  const now=Date.now(),aff={};
  getHistory().forEach(h=>{
    const days=(now-(h.at||now))/86400000;
    const w=Math.pow(0.5,days/HALF_LIFE_DAYS);
    (h.tags||[]).forEach(t=>{aff[t]=(aff[t]||0)+w});
  });
  return aff;
}
function topAffinityTags(n=3){
  const aff=tagAffinity();
  return Object.entries(aff).sort((a,b)=>b[1]-a[1]).slice(0,n).map(e=>e[0]);
}
// Scores every candidate post. Tag overlap dominates, then a small nudge for
// posts people actually read and for anything published recently, so a brand
// new post is not buried under an old popular one forever.
function scorePosts(posts,{exclude=[],seedTags=null,limit=5}={}){
  const aff=seedTags?Object.fromEntries(seedTags.map(t=>[t,1.4])):tagAffinity();
  const readSlugs=new Set(getHistory().map(h=>h.slug));
  const skip=new Set([...exclude,...(seedTags?[]:readSlugs)]);
  const maxViews=Math.max(1,...posts.map(p=>p.views||0));
  const now=Date.now();
  const scored=posts.filter(p=>!skip.has(p.slug)).map(p=>{
    let tagScore=0,best=null,bestW=0;
    (p.tags||[]).forEach(t=>{
      const w=aff[t]||0;
      tagScore+=w;
      if(w>bestW){bestW=w;best=t}
    });
    const ageDays=(now-new Date(p.publishAt||p.createdAt).getTime())/86400000;
    const freshness=Math.pow(0.5,Math.max(0,ageDays)/240);
    const popularity=(p.views||0)/maxViews;
    return {post:p,score:tagScore*3+popularity*0.9+freshness*0.6,why:best};
  }).sort((a,b)=>b.score-a.score);
  return scored.slice(0,limit);
}
// Compact ranked list used by both the homepage and the end of an article.
function recListHtml(items){
  return `<div class="rec-list">${items.map((it,i)=>{
    const p=it.post;
    return `<div class="rec-item" onclick="go('/p/${jsq(p.slug)}')">
      <span class="rec-n">${String(i+1).padStart(2,"0")}</span>
      <div>
        <div class="rec-title">${esc(p.title)}</div>
        <div class="rec-meta">${it.why?`<span class="rec-tag">#${esc(clip(it.why,20))}</span> · `:""}${p.readingTime} min read · ${fmtNum(p.views)} views</div>
      </div>
    </div>`;
  }).join("")}</div>`;
}
// Homepage block. Stays hidden until there is enough history to say anything
// honest, because a "recommended for you" list built from one page view is
// just a random list with a confident label on it.
function recommendedHtml(posts){
  const hist=getHistory();
  if(hist.length<2)return "";
  const items=scorePosts(posts,{limit:5});
  if(!items.length)return "";
  const tags=topAffinityTags(2).map(t=>"#"+clip(t,18));
  return `<div class="rec-section">
    <div class="rec-head"><h2>Recommended for you</h2></div>
    <p class="rec-why">${tags.length?`Based on what you have been reading lately${tags.length?` (${esc(tags.join(", "))})`:""}.`:"Based on what you have been reading lately."} <button class="show-more-inline" style="padding:0" onclick="clearHistory();route()">Reset</button></p>
    ${recListHtml(items)}
  </div>`;
}
// End of article block: seeded by this post's own tags first, so it works even
// for a first time visitor with no history at all.
function moreLikeThisHtml(posts,current){
  if(!posts.length||!current)return "";
  const seeded=scorePosts(posts,{exclude:[current.slug],seedTags:current.tags||[],limit:3});
  const personal=scorePosts(posts,{exclude:[current.slug,...seeded.map(s=>s.post.slug)],limit:2});
  const items=[...seeded,...personal].slice(0,4);
  if(!items.length)return "";
  return `<div class="rec-section" style="margin-top:40px">
    <div class="rec-head"><h2>More like this</h2></div>
    <p class="rec-why">Picked from the same topics, plus whatever else you have opened here.</p>
    ${recListHtml(items)}
  </div>`;
}

// ---------------------------------------------------------------------------
// SEARCH GUARD
// The search box is a public endpoint that hits the database on every call,
// so the client throttles itself before the server ever has to: a minimum
// query length, a debounce, a hard cap on requests per rolling window, and a
// visible cooldown when that cap is hit. The server enforces its own limit
// too (searchLimiter), this half just keeps honest users from tripping it.
// ---------------------------------------------------------------------------
const SEARCH_GUARD={max:12,windowMs:10000,cooldownMs:8000,hits:[],lockedUntil:0};
const SEARCH_MAXLEN=80;
const SEARCH_MINLEN=2;
// Strips control characters and angle brackets, collapses whitespace and caps
// the length. Nothing user-typed reaches the URL or the API before this.
function cleanQuery(s){
  return String(s==null?"":s)
    .replace(/[\u0000-\u001f\u007f<>]/g,"")
    .replace(/\s+/g," ")
    .trim()
    .slice(0,SEARCH_MAXLEN);
}
function searchAllowed(){
  const now=Date.now();
  if(now<SEARCH_GUARD.lockedUntil)return false;
  SEARCH_GUARD.hits=SEARCH_GUARD.hits.filter(t=>now-t<SEARCH_GUARD.windowMs);
  if(SEARCH_GUARD.hits.length>=SEARCH_GUARD.max){
    SEARCH_GUARD.lockedUntil=now+SEARCH_GUARD.cooldownMs;
    return false;
  }
  SEARCH_GUARD.hits.push(now);
  return true;
}
function searchCooldownLeft(){
  return Math.max(0,Math.ceil((SEARCH_GUARD.lockedUntil-Date.now())/1000));
}
function setSearchHint(msg,warn){
  const el=document.getElementById("searchHint");
  if(!el)return;
  el.textContent=msg||"";
  el.className="search-hint"+(warn?" warn":"");
}
// Shows the cooldown counting down, then unlocks the input again.
function runSearchCooldown(input){
  const row=input?.closest(".search-row");
  row?.classList.add("locked");
  if(input)input.disabled=true;
  clearInterval(runSearchCooldown._t);
  const tick=()=>{
    const left=searchCooldownLeft();
    if(left<=0){
      clearInterval(runSearchCooldown._t);
      row?.classList.remove("locked");
      if(input){input.disabled=false;input.focus()}
      setSearchHint("");
      return;
    }
    setSearchHint(`Too many searches at once, try again in ${left}s.`,true);
  };
  tick();
  runSearchCooldown._t=setInterval(tick,500);
}

async function viewList(searchTerm){
  if(currentController)currentController.abort("navigated-away");

  app.innerHTML=`
    ${term?"":mastheadHtml(0)}

    <div class="hero-row" id="heroRow" style="display:none"><div id="heroSlot"></div><div id="latestSlot"></div></div>

        <input id="q" type="search" inputmode="search" maxlength="${SEARCH_MAXLEN}" spellcheck="false"
               placeholder="Search posts" value="${term?esc(term):""}" autocomplete="off" aria-label="Search posts"/>
        ${term?`<button class="search-clear" onclick="go('/')" title="Clear search" aria-label="Clear search">${ICONS.close}</button>`:""}
        <span class="search-spinner" id="searchSpinner">${ICONS.spinner}</span>

  const input=document.getElementById("q"),spinner=document.getElementById("searchSpinner");
  mountSidebar();
  if(term)setSearchHint(`Showing results for “${term}”.`);
  // Debounced, length-gated, rate-limited. Navigation is what actually runs
  // the query, so the guard sits in front of go().
  let timer;
  if(!term){input.focus();input.setSelectionRange(input.value.length,input.value.length)}
  input.oninput=()=>{
    clearTimeout(timer);
    const raw=cleanQuery(input.value);
    if(raw&&raw.length<SEARCH_MINLEN){
      spinner.classList.remove("show");
      setSearchHint(`Type at least ${SEARCH_MINLEN} characters.`);
      return;
    }
    setSearchHint("");
    spinner.classList.add("show");
    timer=setTimeout(()=>{
      spinner.classList.remove("show");
      if(!searchAllowed()){runSearchCooldown(input);return}
      go(raw?"/?q="+encodeURIComponent(raw):"/");
    },420);
  };
  input.onkeydown=(e)=>{
    if(e.key!=="Enter")return;
    clearTimeout(timer);
    const raw=cleanQuery(input.value);
    if(raw&&raw.length<SEARCH_MINLEN){setSearchHint(`Type at least ${SEARCH_MINLEN} characters.`);return}
    if(!searchAllowed()){runSearchCooldown(input);return}
    go(raw?"/?q="+encodeURIComponent(raw):"/");
  };

  let homeTags=[];
  if(!term){
    try{
      homeTags=await api("/tags",{},ctrl.signal);
      renderTagCloud(homeTags);
    }catch{}
  }
  const list=document.getElementById("list");
  try{
    const posts=term
      ?await api("/search?q="+encodeURIComponent(term),{},ctrl.signal)
      :await api("/posts",{},ctrl.signal);
    spinner.classList.remove("show");
    if(!list||!document.body.contains(list))return;
    const heroRow=document.getElementById("heroRow");
    const heroSlot=document.getElementById("heroSlot");
    const latestSlot=document.getElementById("latestSlot");
    const shSlot=document.getElementById("startHereSlot");
    const trSlot=document.getElementById("topRatedSlot");
    const topicSlot=document.getElementById("topicSlot");
    const note=document.getElementById("listNote");

    if(term){
      if(heroRow)heroRow.style.display="none";
      if(note)note.textContent=`${posts.length} result${posts.length===1?"":"s"}`;
      const heading=document.getElementById("listHeading");
      if(heading)heading.textContent=`Results for “${clip(term,40)}”`;
      renderPagedList(posts,`<div class="illus-wrap illus-empty">${ILLUS.webSearch}</div><div class="empty-icon">⌕</div>No posts matched “${esc(term)}”<div class="empty-detail">Try a shorter word, or <a href="#" onclick="event.preventDefault();go('/')" style="color:var(--accent)">browse everything</a>.</div>`);
      return;
    }

    const mhCount=document.getElementById("mhCount");
    if(mhCount)mhCount.textContent=posts.length?`${posts.length} post${posts.length===1?"":"s"} published`:"";
    if(posts.length){
      if(heroRow)heroRow.style.display="";
      if(heroSlot)heroSlot.innerHTML=heroHtml(posts[0]);
      mountSponsor("sponsorTop");
      const recSlot=document.getElementById("recSlot");
      const recHtml=recommendedHtml(posts);
      if(recSlot)recSlot.innerHTML=recHtml;
      // "Start here" is for people with no history; once the recommendations
      // have something real to say, showing both is just two lists of links.
      if(shSlot)shSlot.innerHTML=recHtml?"":startHereHtml(posts);
      if(trSlot)trSlot.innerHTML=topRatedHtml(posts,posts[0].slug);
      if(topicSlot)topicSlot.innerHTML=topicGridHtml(homeTags);
      if(note)note.textContent=`${posts.length} post${posts.length===1?"":"s"}`;
      renderPagedList(posts.slice(1),`<div class="empty-icon">✎</div>Nothing else here yet.`);
      mountReveals();
    }else{
      if(heroRow)heroRow.style.display="none";
      renderPagedList([],`<div class="empty-icon">✎</div>No posts yet, the first one is coming.`);
    }
  }catch(e){
    spinner.classList.remove("show");
    if(e.error==="cancelled"||!list||!document.body.contains(list))return;
    if(isServerDownError(e)){
      app.innerHTML=serverDownPage(`viewList(${term?`'${jsq(term)}'`:""})`);
      return;
    }
    list.innerHTML=`<div class="empty">${errorBlock(e.error||"Could not load posts.")}<button class="btn ghost small" onclick="viewList(${term?`'${jsq(term)}'`:""})">Try again</button></div>`;
  }
}

// The tag cloud shows a first handful and keeps the long tail behind a
// "show all" toggle, so a blog with forty tags doesn't open with a wall.
const TAGCLOUD_PREVIEW=10;
let tagcloudExpanded=false;
function renderTagCloud(tags){
  const el=document.getElementById("tagcloud");
  if(!el||!tags||!tags.length)return;
  const sorted=tags.slice().sort((a,b)=>b.count-a.count);
  // A phone fits far fewer chips before the cloud turns into a wall of text.
  const preview=window.matchMedia?.("(max-width:680px)").matches?6:TAGCLOUD_PREVIEW;
  const shown=tagcloudExpanded?sorted:sorted.slice(0,preview);
  const rest=sorted.length-shown.length;
  el.innerHTML=shown.map(t=>
    `<button type="button" title="${esc(t.tag)}" onclick="go('/tag/'+encodeURIComponent('${jsq(t.tag)}'))">#${esc(clip(t.tag,22))}<span class="tc-n">${t.count}</span></button>`
  ).join("")
  +(rest>0?`<button type="button" class="tc-toggle" onclick="tagcloudExpanded=true;renderTagCloud(window.__tagsCache||[])">+${rest} more</button>`
   :(tagcloudExpanded&&sorted.length>preview?`<button type="button" class="tc-toggle" onclick="tagcloudExpanded=false;renderTagCloud(window.__tagsCache||[])">Show less</button>`:""));
  window.__tagsCache=tags;
}

// Renders the main list a page at a time behind a "show more" control instead
// of dumping forty cards into the DOM at once.
function renderPagedList(posts,emptyMsg){
  listState.posts=posts;
  listState.shown=Math.min(LIST_PAGE_SIZE,posts.length);
  const list=document.getElementById("list");
  if(!list)return;
  if(!posts.length){
    list.innerHTML=`<div class="empty">${emptyMsg}</div>`;
    const more=document.getElementById("listMore");
    if(more)more.innerHTML="";
    return;
  }
  renderCards(list,posts.slice(0,listState.shown),"");
  renderListMore();
}
function renderListMore(){
  const more=document.getElementById("listMore");
  if(!more)return;
  const left=listState.posts.length-listState.shown;
  more.innerHTML=left>0
    ?`<div class="show-more"><button type="button" onclick="showMorePosts()">Show ${Math.min(left,LIST_PAGE_SIZE)} more · ${left} left</button></div>`
    :(listState.posts.length>LIST_PAGE_SIZE?`<div class="show-more"><button type="button" onclick="collapsePosts()">That's everything, collapse</button></div>`:"");
}
function showMorePosts(){
  const list=document.getElementById("list");
  if(!list)return;
  const from=listState.shown;
  listState.shown=Math.min(listState.shown+LIST_PAGE_SIZE,listState.posts.length);
  list.insertAdjacentHTML("beforeend",cardsHtml(listState.posts.slice(from,listState.shown)));
  renderListMore();
}
function collapsePosts(){
  listState.shown=Math.min(LIST_PAGE_SIZE,listState.posts.length);
  const list=document.getElementById("list");
  if(list)renderCards(list,listState.posts.slice(0,listState.shown),"");
  renderListMore();
  document.getElementById("listSection")?.scrollIntoView({behavior:"smooth",block:"start"});
}

// Colorful "Explore by Topic" tiles, a visual, clickable way into the tag
// cloud, cycling through a small fixed palette so it stays consistent across
// reloads (colors keyed by position, not randomized).
const TOPIC_PALETTE=["#4a6741","#9a6a00","#a13a26","#3a5a9a","#6b4a9e","#2d7d6e","#b0563d","#4a6b3a"];
function topicGridHtml(tags){
  if(!tags.length)return "";
  const top=tags.slice().sort((a,b)=>b.count-a.count).slice(0,8);
  return `<div class="topic-section">
    <div class="topic-heading">Topics</div>
    <p class="topic-sub">Pick a topic and read everything filed under it.</p>
    <div class="topic-grid">${top.map((t,i)=>
      `<div class="topic-tile" style="--tt-color:${TOPIC_PALETTE[i%TOPIC_PALETTE.length]}" title="${esc(t.tag)}" onclick="go('/tag/'+encodeURIComponent('${jsq(t.tag)}'))">
        <div class="tt-name">#${esc(clip(t.tag,20))}</div>
        <div class="tt-count">${t.count} post${t.count===1?"":"s"}</div>
      </div>`
    ).join("")}</div>
