// "Start Here", a curated reading path for first-time visitors, computed
// automatically from the data that already exists (no manual curation
// needed): the oldest post (where the story began), the most-read post
// (what resonated), and a post from a different tag (for range).
function startHereHtml(posts){
  if(posts.length<3)return "";
  const byDate=posts.slice().sort((a,b)=>new Date(a.publishAt||a.createdAt)-new Date(b.publishAt||b.createdAt));
  const oldest=byDate[0];
  const popular=posts.slice().sort((a,b)=>b.views-a.views)[0];
  const usedSlugs=new Set([oldest.slug,popular.slug]);
  const usedTags=new Set([...oldest.tags,...popular.tags]);
  const diverse=posts.find(p=>!usedSlugs.has(p.slug)&&p.tags.some(t=>!usedTags.has(t)))
    || posts.find(p=>!usedSlugs.has(p.slug))
    || posts[0];
  const items=[
    {p:oldest,label:"Where it started",note:"The first thing I posted here."},
    {p:popular,label:"Most-read",note:"The one that resonated most with readers."},
    {p:diverse,label:"Something different",note:"A change of pace from a different topic."},
  ];
  return `<div class="start-here"><div class="sh-heading"><span class="sh-badge">New here?</span>Start with these three</div>
    <div class="sh-grid">${items.map(it=>`
      <div class="sh-card" onclick="go('/p/${jsq(it.p.slug)}')">
        <div class="sh-label">${it.label}</div>
        <div class="sh-title">${esc(it.p.title)}</div>
        <div class="sh-note">${esc(it.note)}</div>
      </div>`).join("")}
    </div>
  </div>`;
}
// "The Latest" headline panel, compact list beside the hero, Treehugger
// style: eyebrow tag + headline + date, no images, fast to scan.
function latestHtml(posts){
  if(!posts.length)return "";
  return `<div class="latest-panel"><span class="lp-heading">Latest</span>${posts.map(p=>
    `<div class="latest-item" onclick="go('/p/${jsq(p.slug)}')">
      <div class="li-tag">${p.tags[0]?"#"+esc(clip(p.tags[0],20)):"Post"}</div>
      <div class="li-title">${esc(p.title)}</div>
      <div class="li-meta">${fmtDate(p.publishAt||p.createdAt)} · ${p.readingTime} min read</div>
    </div>`
  ).join("")}</div>`;
}
// Scroll-reveal, homepage sections fade in as they enter the viewport.
// One-shot per element; disconnects when everything has been shown.
let revealObserver=null;
function mountReveals(){
  if(revealObserver)revealObserver.disconnect();
  const els=document.querySelectorAll(".reveal:not(.in)");
  if(!els.length)return;
  if(window.matchMedia?.("(prefers-reduced-motion: reduce)").matches){
    els.forEach(el=>el.classList.add("in"));return;
  }
  if(!("IntersectionObserver"in window)){els.forEach(el=>el.classList.add("in"));return}
  revealObserver=new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){e.target.classList.add("in");revealObserver.unobserve(e.target)}
    });
  },{threshold:.08,rootMargin:"0px 0px -40px 0px"});
  els.forEach(el=>revealObserver.observe(el));
  // Failsafe: nothing stays invisible. If a section never trips the observer
  // (odd viewport, print, a screenshot tool, a layout shift), show it anyway.
  clearTimeout(mountReveals._t);
  mountReveals._t=setTimeout(()=>{
    document.querySelectorAll(".reveal:not(.in)").forEach(el=>{
      const r=el.getBoundingClientRect();
      if(r.top<window.innerHeight*1.5)el.classList.add("in");
    });
  },2200);
}
// Prominent "Top Rated" strip, the 3 most-read posts, ranked, shown right
// under the hero so returning readers see what's worth their time first.
function topRatedHtml(posts,excludeSlug){
  const ranked=[...posts].filter(p=>p.slug!==excludeSlug).sort((a,b)=>b.views-a.views).slice(0,3);
  if(!ranked.length)return "";
  return `<div class="top-rated"><div class="tr-heading"><span class="tr-badge">Most read</span>What people actually finish</div>
    <div class="tr-grid">${ranked.map((p,i)=>{
      const thumb=coverOf(p)
        ?`<img class="tr-thumb" src="${esc(coverOf(p))}" alt="" loading="lazy" style="object-position:${coverPosition(p)}"/>`
        :`<div class="tr-thumb" style="display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:600;font-size:24px;color:var(--muted)">${esc((p.title||"?")[0].toUpperCase())}</div>`;
      return `<div class="tr-card" onclick="go('/p/${jsq(p.slug)}')"><span class="tr-rank">${i+1}</span>${thumb}<div class="tr-body"><div class="tr-title">${esc(p.title)}</div><div class="tr-views">${fmtNum(p.views)} views · ${p.readingTime} min read</div></div></div>`;
    }).join("")}</div></div>`;
}
function heroHtml(p){
  const img=coverOf(p)
    ?`<img class="hero-img" src="${esc(coverOf(p))}" alt="" loading="lazy" style="object-position:${coverPosition(p)}"/>`
    :`<div class="hero-img">${esc((p.title||"?")[0].toUpperCase())}</div>`;
  return `<div class="hero-post${coverOf(p)?"":" no-image"}" onclick="go('/p/${jsq(p.slug)}')">
    ${img}
    <div class="hero-content">
      <div class="hero-eyebrow">${p.pinned?"Pinned · ":"Featured · "}${p.tags[0]?"#"+esc(clip(p.tags[0],22)):"Latest"}</div>
      <div class="hero-title">${esc(p.title)}</div>
      <div class="hero-excerpt">${esc(p.subtitle||p.excerpt)}</div>
      <div class="hero-meta">${fmtDate(p.publishAt||p.createdAt)} · ${p.readingTime} min read · ${p.views} views</div>
    </div>
  </div>`;
}
// One card. Meta line is deliberately short: date, up to two tags, reading
// time. Titles and excerpts are clamped by CSS so every row keeps its rhythm
// however long the copy runs.
function cardHtml(p){
  const cover=coverOf(p);
  const inner=cover
    ?`<img class="pc-thumb" src="${esc(cover)}" alt="" loading="lazy" style="object-position:${coverPosition(p)}"/>`
    :`<div class="pc-thumb">${esc((p.title||"?")[0].toUpperCase())}</div>`;
  // Cover sits in its own frame so the hover overlay has something to cover.
  const thumb=`<div class="pc-thumb-wrap">${inner}<div class="pc-overlay"><span class="pc-overlay-btn">Read post</span></div></div>`;
  // The strip under the meta line is the blog's answer to the tech-stack row
  // on a project card: hidden until hover, then the full tag list.
  const rest=Array.isArray(p.tags)?p.tags.slice(1):[];
  const details=`<div class="pc-details"><span class="pc-details-rule"></span>${rest.length?tagChips(rest,5,false):`<span class="tag-more">${esc(fmtDate(p.publishAt||p.createdAt))}</span>`}</div>`;
  return `<article class="post-card" onclick="go('/p/${jsq(p.slug)}')">
    <div class="pc-body">
      <div class="pc-byline"><span class="pc-avatar">R</span><span>Rafi Arsya</span><span style="color:var(--muted)">·</span><span style="color:var(--muted)">${fmtDate(p.publishAt||p.createdAt)}</span>${p.pinned?`<span class="pinned-badge">· Pinned</span>`:""}</div>
      <h3 class="post-title">${esc(p.title)}</h3>
      <p class="post-excerpt">${esc(p.subtitle||p.excerpt)}</p>
      <div class="post-meta">${tagChips(p.tags,1)}<span>${p.readingTime} min read</span><span class="pc-views">${fmtNum(p.views)} views</span>${bookmarkBtn(p.slug,p.title)}</div>
    </div>
    ${details}
    ${thumb}
  </article>`;
}
function cardsHtml(posts){return posts.map(cardHtml).join("")}
function renderCards(el,posts,emptyMsg){
  if(!posts.length){el.innerHTML=`<div class="empty">${emptyMsg}</div>`;return}
  el.innerHTML=cardsHtml(posts);
}

// SIDEBAR, one calm rail on the right (it used to be two, which made every
// page feel like a newspaper wall). Profile, what's popular, the shelves, the
// archive, a random pick, and a small tip jar. Everything long is capped with
// a "show more" so the rail never out-scrolls the article beside it.

let sidebarLoaded=false;
let sidebarPostsCache=[];
let sidebarTagsCache=[];
let sidebarTagsExpanded=false;
let sidebarArchiveExpanded=false;
const SIDEBAR_TAGS_PREVIEW=8;
const SIDEBAR_ARCHIVE_PREVIEW=6;

function showSidebar(){document.getElementById("pageGrid")?.classList.add("with-sidebar")}
function hideSidebar(){document.getElementById("pageGrid")?.classList.remove("with-sidebar")}

async function mountSidebar(){
  showSidebar();
  const right=document.getElementById("sidebar");
  if(!right)return;
  if(!sidebarLoaded){
    const skel=`<div class="widget"><div class="skel-line" style="height:10px;width:100px;margin-bottom:16px"></div><div class="skel-line" style="height:13px;width:92%;margin-bottom:10px"></div><div class="skel-line" style="height:13px;width:78%;margin-bottom:10px"></div><div class="skel-line" style="height:13px;width:85%"></div></div>`;
    right.innerHTML=skel+skel;
  }
  try{
    const [posts,tags]=await Promise.all([api("/posts"),api("/tags")]);
    sidebarLoaded=true;
    sidebarPostsCache=posts;
    sidebarTagsCache=tags;
    renderSidebar();
  }catch{
    if(!sidebarLoaded)right.innerHTML="";
  }
}
function renderSidebar(){
  const right=document.getElementById("sidebar");
  if(!right)return;
  right.innerHTML=
    profileWidget()+
    popularWidget(sidebarPostsCache)+
    tagsWidget(sidebarTagsCache)+
    archiveWidget(sidebarPostsCache)+
    randomWidget()+
    supportWidget();
  tuneStickyRails();
}

// ---- sticky rail ----
// A rail that fits the viewport just sticks below the header. A taller one
// gets a negative top so it scrolls with the page until its bottom is in
// view, then locks while the article keeps going.
const RAIL_TOP=88,RAIL_GAP=24;
let railRO=null;
function tuneStickyRails(){
  const rail=document.getElementById("sidebar");
  if(!rail)return;
  const h=rail.offsetHeight,vh=window.innerHeight;
  const top=(h+RAIL_TOP+RAIL_GAP<=vh)?RAIL_TOP:Math.round(vh-h-RAIL_GAP);
  rail.style.setProperty("--rail-top",top+"px");
  if(!railRO&&"ResizeObserver"in window){
    railRO=new ResizeObserver(()=>{
      if(tuneStickyRails._raf)return;
      tuneStickyRails._raf=requestAnimationFrame(()=>{tuneStickyRails._raf=null;tuneStickyRails()});
    });
    railRO.observe(rail);
  }
}
window.addEventListener("resize",()=>{clearTimeout(tuneStickyRails._t);tuneStickyRails._t=setTimeout(tuneStickyRails,120)});

function profileWidget(){
  return `<div class="widget widget-profile">
    <div class="avatar">R</div>
    <div class="name">Rafi Arsya</div>
    <div class="bio">Computer science student in Kuala Lumpur. I write down what I build, what breaks, and what I would do differently.</div>
    <div class="links">
      <a href="https://rafiarsya.com" target="_blank" rel="noopener">Portfolio</a>
      <a href="#" onclick="event.preventDefault();go('/about')">About</a>
      <a href="/rss.xml" target="_blank" rel="noopener">RSS</a>
    </div>
  </div>`;
}

function popularWidget(posts){
  const top=[...posts].sort((a,b)=>b.views-a.views).slice(0,5);
  if(!top.length)return "";
  return `<div class="widget"><div class="widget-title">Most read</div><div class="popular-list">${top.map((p,i)=>
    `<a class="popular-item" onclick="go('/p/${jsq(p.slug)}')">
      <span class="pi-num">${String(i+1).padStart(2,"0")}</span>
      <span class="pi-body">
        <span class="pi-title">${esc(p.title)}</span>
        <span class="pi-meta">${fmtNum(p.views)} view${p.views===1?"":"s"} · ${p.readingTime} min</span>
      </span>

  ).join("")}</div></div>`;
}

function tagsWidget(tags){
  if(!tags||!tags.length)return "";
  const sorted=tags.slice().sort((a,b)=>b.count-a.count);
  const shown=sidebarTagsExpanded?sorted:sorted.slice(0,SIDEBAR_TAGS_PREVIEW);
  const rest=sorted.length-shown.length;
  return `<div class="widget"><div class="widget-title">Topics</div><div class="widget-tags">${shown.map(t=>
    `<button type="button" title="${esc(t.tag)}" onclick="go('/tag/'+encodeURIComponent('${jsq(t.tag)}'))">#${esc(clip(t.tag,18))}</button>`
  ).join("")}</div>${
    rest>0?`<button class="show-more-inline" onclick="sidebarTagsExpanded=true;renderSidebar()">Show ${rest} more →</button>`
    :(sidebarTagsExpanded&&sorted.length>SIDEBAR_TAGS_PREVIEW?`<button class="show-more-inline" onclick="sidebarTagsExpanded=false;renderSidebar()">Show fewer</button>`:"")
  }</div>`;
}

function archiveWidget(posts){
  const counts={};
  posts.forEach(p=>{
    const d=new Date(p.publishAt||p.createdAt);
    const key=d.toLocaleString("en-US",{month:"long",year:"numeric"});
    counts[key]=(counts[key]||0)+1;
  });
  const entries=Object.entries(counts);
  if(!entries.length)return "";
  const shown=sidebarArchiveExpanded?entries:entries.slice(0,SIDEBAR_ARCHIVE_PREVIEW);
  const rest=entries.length-shown.length;
  return `<div class="widget"><div class="widget-title">Archive</div><ul class="widget-archive">${shown.map(([label,count])=>
    `<li><span>${esc(label)}</span><span class="wa-count">${count}</span></li>`
  ).join("")}</ul>${
    rest>0?`<button class="show-more-inline" onclick="sidebarArchiveExpanded=true;renderSidebar()">Show ${rest} more months →</button>`
    :(sidebarArchiveExpanded?`<button class="show-more-inline" onclick="sidebarArchiveExpanded=false;renderSidebar()">Show fewer</button>`:"")
  }<button class="show-more-inline" style="display:block" onclick="go('/archive')">Open the full archive →</button></div>`;
}

function randomWidget(){
  return `<div class="widget"><div class="widget-title">Feeling lucky?</div>
    <p style="font-size:13.5px;color:var(--ink-2);line-height:1.55;margin-bottom:12px">Open something at random.</p>
    <button class="btn ghost small" style="width:100%" onclick="jumpRandomPost(this)"><span class="dice">🎲</span><span>Surprise me</span></button>
  </div>`;
}
function jumpRandomPost(btn){
  if(!sidebarPostsCache.length)return;
  const pick=sidebarPostsCache[Math.floor(Math.random()*sidebarPostsCache.length)];
  const dice=btn?.querySelector(".dice");
  if(dice){
    dice.classList.add("rolling");
    setTimeout(()=>{dice.classList.remove("rolling");go("/p/"+pick.slug)},560);
  }else go("/p/"+pick.slug);
}

function supportWidget(){
  return `<div class="widget widget-support">
    <div class="widget-title">Enjoyed a post?</div>
    <p style="font-size:13.5px;color:var(--ink-2);line-height:1.55;margin-bottom:12px">Nalar runs off a mini PC in my room. No ads, no paywall. A tip is optional and always appreciated.</p>
    <button class="btn small" style="width:100%" onclick="openSupportModal()">☕ Support this blog</button>
  </div>`;
}

// kept for the dashboard's animated figures
function animateStatNums(){
  document.querySelectorAll(".stat-num[data-count]").forEach(el=>{
    const target=parseInt(el.dataset.count,10)||0;
    if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){el.textContent=fmtNum(target);return}
    const dur=700,start=performance.now();
    function tick(now){
      const t=Math.min((now-start)/dur,1);
      el.textContent=fmtNum(Math.round(target*(1-Math.pow(1-t,3))));
      if(t<1)requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
}

async function viewTag(tag){
  if(currentController)currentController.abort("navigated-away");
  const ctrl=currentController=new AbortController();

// Extract h2/h3 headings from rendered HTML to build a table of contents.
// Mutates nothing, just reads the headings already in the DOM after the
// post body is inserted, and injects matching ids if marked.js didn't.
function buildToc(bodyEl){
  const headings=bodyEl.querySelectorAll("h2, h3");
  if(headings.length<3)return ""; // not worth a TOC for a short post
  const items=[...headings].map((h,i)=>{
    if(!h.id)h.id=`sec-${i}-${h.textContent.trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").slice(0,40)}`;
    const lvl=h.tagName==="H3"?" lvl3":"";
    return `<li class="${lvl.trim()}"><a href="#${h.id}">${esc(h.textContent)}</a></li>`;
  }).join("");
  return `<details class="toc" open><summary>Contents</summary><ol>${items}</ol></details>`;
}

const REACTION_EMOJI=["👍","❤️","🔥","😮","😂","🤔"];
function reactionsRow(slug,reactions,mine){

// Update one reaction button in place (no full re-render) so the click
// animation can play. Plays a pop + floating emoji + ring burst when turning a
// reaction ON, Facebook-style.
async function react(slug,emoji){
  const row=document.getElementById("reactions");
  const btn=row?.querySelector(`.reaction-btn[data-emoji="${CSS.escape(emoji)}"]`);
  if(!btn)return;
  try{
    const r=await api("/posts/"+slug+"/react",{method:"POST",body:JSON.stringify({emoji})});
    // sync active state + count for this button from the server's fresh counts
    btn.classList.toggle("active",r.added);
    const countEl=btn.querySelector(".count");
    const n=r.counts[emoji]||0;
    countEl.textContent=n;
    countEl.style.display=n>0?"":"none";
    // also refresh sibling counts in case they changed (rare, but cheap)
    REACTION_EMOJI.forEach(e=>{
      if(e===emoji)return;
      const b=row.querySelector(`.reaction-btn[data-emoji="${CSS.escape(e)}"] .count`);
      if(b){const c=r.counts[e]||0;b.textContent=c;b.style.display=c>0?"":"none";}
    });
    // animation: pop always; float + ring only when activating
    btn.classList.remove("pop");void btn.offsetWidth;btn.classList.add("pop");
    if(r.added)spawnReactionBurst(btn,emoji);
  }catch(e){showToast(e.error||"Could not react",true)}
}
function spawnReactionBurst(btn,emoji){
  if(window.matchMedia?.("(prefers-reduced-motion: reduce)").matches)return;
  const float=document.createElement("span");
  float.className="react-float";float.textContent=emoji;
  const ring=document.createElement("span");ring.className="react-ring";
  btn.appendChild(ring);btn.appendChild(float);
  setTimeout(()=>{float.remove();ring.remove()},950);
}

function ratingStars(value,max=5){

  for(let i=1;i<=max;i++)out+=`<span class="star${i<=Math.round(value)?" filled":""}">${i<=Math.round(value)?ICONS.starFull:ICONS.starEmpty}</span>`;
  return out;
}
function ratingInput(){

    ${[5,4,3,2,1].map(n=>`<span class="star" data-n="${n}" onclick="setRating(${n})">${ICONS.starEmpty}</span>`).join("")}
  </div>`;
}
function setRating(n){
  const el=document.getElementById("ratingInput");
  el.dataset.value=n;

}

// Total comment count including nested replies, for the header badge.
function countComments(comments){
  return comments.reduce((n,c)=>n+1+(c.replies?countComments(c.replies):0),0);
}
// Render a single comment node (and its replies recursively). `mine` = the
// visitor owns it (has the edit token); `admin` = logged-in author viewing.
function commentNode(slug,c,{admin}){
  const mine=!!tokenFor(c.id);
  const canEdit=admin||mine;
  const canDelete=admin||mine;
  const canReply=admin && !c.isAdmin; // author replies to readers, not to self
  const canPin=admin && !c.parentId; // pinning only makes sense for top-level comments
  const stars=c.rating?`<span class="rating-stars">${ratingStars(c.rating)}</span>`:"";
  const badge=c.isAdmin?`<span class="comment-badge">Author</span>`:"";
  const pinnedBadge=c.pinned?`<span class="pinned-badge">📌 Pinned</span>`:"";
  const edited=c.updatedAt&&c.updatedAt>c.createdAt+1500?`<span class="comment-edited">· edited</span>`:"";
  const actions=[];
  if(canReply)actions.push(`<button onclick="openReply('${slug}',${c.id})">Reply</button>`);
  if(canPin)actions.push(`<button onclick="togglePinComment(${c.id})">${c.pinned?"Unpin":"Pin"}</button>`);
  if(canEdit)actions.push(`<button onclick="openEdit(${c.id})">Edit</button>`);
  if(canDelete)actions.push(`<button class="danger" onclick="deleteComment('${slug}',${c.id})">Delete</button>`);
  const repliesHtml=(c.replies&&c.replies.length)
    ?`<div class="comment-replies">${c.replies.map(r=>commentNode(slug,r,{admin})).join("")}</div>`:"";
  return `<div class="comment-item${c.isAdmin?" is-admin":""}${c.pinned?" is-pinned":""}" id="comment-${c.id}" data-id="${c.id}">
    <div class="comment-head">
      <div class="comment-avatar">${esc(c.author[0]?.toUpperCase()||"?")}</div>
      <span class="comment-author">${esc(c.author)}</span>
      ${badge}${pinnedBadge}${stars}
      <span class="comment-date" title="${esc(fmtDateTime(c.createdAt))}">${timeAgo(c.createdAt)}</span>
      ${edited}
    </div>
    <div class="comment-body" id="comment-body-${c.id}">${esc(c.body)}</div>
    ${actions.length?`<div class="comment-actions">${actions.join("")}</div>`:""}
    <div id="reply-slot-${c.id}"></div>
    ${repliesHtml}
  </div>`;
}
async function togglePinComment(id){
  try{
    const {pinned}=await api("/admin/comments/"+id+"/pin",{method:"POST"});
    showToast(pinned?"Comment pinned to top":"Comment unpinned");

  }catch(e){showToast(e.error||"Could not update pin",true)}

// Long threads are folded: the first few show, the rest sit behind a button.
const COMMENTS_PREVIEW=5;
let commentsState={slug:"",list:[],expanded:false};
function renderCommentList(){
  const el=document.getElementById("commentsList");
  if(!el)return;
  const {slug,list,expanded}=commentsState;
  if(!list.length){
    el.innerHTML=`<div class="no-comments"><div class="illus-wrap illus-small">${ILLUS.commentSent}</div>No comments yet, be the first to share your thoughts.</div>`;
    return;
  }
  const shown=expanded?list:list.slice(0,COMMENTS_PREVIEW);
  const rest=list.length-shown.length;
  el.innerHTML=shown.map(c=>commentNode(slug,c,{admin:!!me})).join("")
    +(rest>0?`<div class="show-more"><button type="button" onclick="commentsState.expanded=true;renderCommentList()">Show ${rest} more comment${rest===1?"":"s"}</button></div>`
      :(expanded&&list.length>COMMENTS_PREVIEW?`<div class="show-more"><button type="button" onclick="commentsState.expanded=false;renderCommentList()">Collapse thread</button></div>`:""));
}
function commentsSection(slug,comments,rating){
  const total=countComments(comments);
  commentsState={slug,list:comments||[],expanded:false};
  const list=`<div class="skel-line" style="height:14px;width:40%"></div>`;

  const ratingHeader=rating.count>0
    ?`<div class="rating-display"><span class="rating-stars">${ratingStars(rating.average)}</span><span class="mono" style="font-size:12px;color:var(--muted)">${rating.average} from ${rating.count} rating${rating.count===1?"":"s"}</span></div>`
    :"";

  return `<div class="comments-section">
    <h3 style="display:flex;align-items:center;gap:10px"><span class="illus-inline" style="max-width:40px;margin:0">${ILLUS.questions}</span>Comments <span class="count-badge">${total}</span></h3>
    ${ratingHeader}
    <div class="comment-form">
      <div id="commentErr"></div>
      <label>Your rating (optional)</label>
      ${ratingInput()}
      <div class="row2" style="margin-top:16px">

        <div><label>Email (optional, never shown)</label><input id="cEmail" type="text" placeholder="you@example.com" style="margin-bottom:0"/></div>
      </div>
      <label style="margin-top:16px">Comment</label>
      <textarea id="cBody" placeholder="What did you think?"></textarea>
      <button class="btn" id="commentBtn" onclick="submitComment('${slug}')">Post comment</button>
    </div>
    <div id="commentsList">${list}</div>
  </div>`;
}
function bumpCommentCount(delta){
  const b=document.querySelector(".comments-section h3 .count-badge");
  if(b)b.textContent=Math.max(0,Number(b.textContent)+delta);
}
async function submitComment(slug){
  const err=document.getElementById("commentErr");err.innerHTML="";
  const author=document.getElementById("cAuthor").value.trim();
  const email=document.getElementById("cEmail").value.trim();
  const body=document.getElementById("cBody").value.trim();
  const rating=Number(document.getElementById("ratingInput").dataset.value)||null;
  if(!author||!body){err.innerHTML=errorBlock("Name and comment can't be empty.");return}
  const btn=document.getElementById("commentBtn");
  btn.disabled=true;const original=btn.innerHTML;btn.innerHTML=`<span class="spin"></span> Posting…`;
  try{
    const c=await api("/posts/"+slug+"/comments",{method:"POST",body:JSON.stringify({author,email,body,rating})});
    if(c.editToken)saveCommentToken(c.id,c.editToken);
    commentsState.list=[...(commentsState.list||[]),{...c,replies:[]}];
    commentsState.expanded=true;
    renderCommentList();
    bumpCommentCount(1);
    document.getElementById("comment-"+c.id)?.scrollIntoView({behavior:"smooth",block:"center"});
    document.getElementById("cAuthor").value="";
    document.getElementById("cEmail").value="";
    document.getElementById("cBody").value="";
    setRating(0);
    showToast("Comment posted");
  }catch(e){
    err.innerHTML=errorBlock(e.error||"Could not post your comment.");
  }finally{
    btn.disabled=false;btn.innerHTML=original;
  }
}

async function submitReply(slug,parentId){
  const ta=document.getElementById("replyBody-"+parentId);
  const body=ta.value.trim();

// Reading-progress bar: how far through the post's body the reader has
// scrolled, 0 at the top of the body to 100 at its end. Bound once per post
// view and torn down implicitly when the page navigates (route() rewrites
// app.innerHTML, which detaches the old listener target along with it  
// but the window-level listener itself needs explicit cleanup).
let progressHandler=null;
function bindProgressBar(bodyEl){
  const bar=document.getElementById("progressBar");
  const left=document.getElementById("readLeft");
  if(progressHandler)window.removeEventListener("scroll",progressHandler);
  // Total reading time is measured once from the rendered body at a steady
  // 200 words a minute, then scaled by how far down the reader is. Recounting
  // on every scroll event would be wasteful and the answer never changes.
  const words=(bodyEl.innerText||"").trim().split(/\s+/).length;
  const totalMin=Math.max(1,Math.round(words/200));
  let lastLabel="";
  progressHandler=()=>{
    const rect=bodyEl.getBoundingClientRect();
    const total=rect.height-window.innerHeight*0.5;
    const passed=Math.min(Math.max(-rect.top,0),Math.max(total,1));
    const pct=Math.min(100,(passed/Math.max(total,1))*100);
    bar.style.width=`${pct}%`;
    // A three minute read does not need a countdown, and saying "1 min left"
    // for most of it would be worse than saying nothing.
    if(!left||totalMin<4)return;
    left.classList.add("live");
    const remain=Math.ceil(totalMin*(1-pct/100));
    left.classList.toggle("show",window.scrollY>window.innerHeight*0.8&&remain>0);
    if(remain<=0)return;
    const label=`<b>${remain}</b> min left`;
    if(label!==lastLabel){left.innerHTML=label;lastLabel=label}
  };
  window.addEventListener("scroll",progressHandler,{passive:true});
  progressHandler();
}
function clearReadLeft(){
  const left=document.getElementById("readLeft");
  if(!left)return;
  left.classList.remove("live","show");
  left.innerHTML="";
}

// ---------------------------------------------------------------------------
// REVEAL ON SCROLL
// Cards and section headings lift into place the first time they are seen, and
// never again. The class that hides them is added from script, so a reader with
// scripting off, or one who asked for reduced motion, is never left staring at
// an empty page: in both cases nothing is ever hidden in the first place.
// ---------------------------------------------------------------------------
const RISE_SEL=[
  ".post-card",".sponsor-card",".series-box",".arch-year",
  ".post-body > h2",".post-body > h3",".post-body > blockquote",
  ".post-body > figure",".post-body > pre",".post-body > .cover",
  ".comments-block",".post-nav",".nl-bar",".page-block",".stat-card"
].join(",");
let riseIO=null;
function mountRise(){
  if(window.matchMedia?.("(prefers-reduced-motion: reduce)").matches)return;
  if(!("IntersectionObserver" in window))return;
  if(!riseIO){
    riseIO=new IntersectionObserver((entries)=>{
      entries.forEach(en=>{
        if(!en.isIntersecting)return;
        en.target.classList.add("in");
        riseIO.unobserve(en.target);
      });
    },{rootMargin:"0px 0px -6% 0px",threshold:.04});
  }
  const fold=window.innerHeight*0.94;
  let n=0;
  document.querySelectorAll(RISE_SEL).forEach(el=>{
    if(el.dataset.rise)return;
    el.dataset.rise="1";
    el.classList.add("rise");
    if(el.getBoundingClientRect().top<fold){
      // Already on screen. Stagger these so the first view settles in order
      // rather than everything arriving at once.
      const d=Math.min(n++,6)*70;
      setTimeout(()=>el.classList.add("in"),d);
    }else{
      riseIO.observe(el);
    }
  });
}
// Every view writes into #app, so watching it is simpler and safer than
// remembering to call mountRise at the end of a dozen render functions.
// Note the name: mountReveals already exists and drives the homepage's
// .reveal slots. These are two separate systems and must not share a name.
function watchRenders(){
  const app=document.getElementById("app");
  if(!app)return;
  let t=null;
  new MutationObserver(()=>{clearTimeout(t);t=setTimeout(mountRise,60)}).observe(app,{childList:true,subtree:true});
  mountRise();
}

// Image lightbox: any image inside a rendered post opens fullscreen on click.
(function initLightbox(){
  const lb=document.getElementById("lightbox"),img=document.getElementById("lightboxImg");
  const close=()=>{lb.classList.remove("open");lb.setAttribute("aria-hidden","true");img.src=""};
  document.getElementById("lightboxClose").innerHTML=ICONS.close;
  document.getElementById("lightboxClose").addEventListener("click",close);
  lb.addEventListener("click",(e)=>{if(e.target===lb)close()});
  document.addEventListener("keydown",(e)=>{if(e.key==="Escape"&&lb.classList.contains("open"))close()});
  window.__openLightbox=(src,alt)=>{img.src=src;img.alt=alt||"";lb.classList.add("open");lb.setAttribute("aria-hidden","false")};
})();

// Post-render enhancements applied to the rendered article body:
//  1. wrap every <pre><code> in a header bar with language label + copy button
//  2. run highlight.js over code blocks (monochrome theme via CSS)
//  3. make images open in the lightbox
// Called once after the post HTML is inserted into the DOM.
function enhancePostBody(bodyEl){
  // --- code blocks ---
  bodyEl.querySelectorAll("pre > code").forEach((code)=>{
    const pre=code.parentElement;
    if(pre.parentElement.classList.contains("code-wrap"))return; // already done
    // detect language from the "language-xxx" class marked.js adds
    let lang="";
    code.classList.forEach(c=>{if(c.startsWith("language-"))lang=c.slice(9)});
    // syntax highlight if the library loaded
    try{if(window.hljs){lang?hljs.highlightElement(code):hljs.highlightElement(code)}}catch{}
    const wrap=document.createElement("div");
    wrap.className="code-wrap has-head";
    const head=document.createElement("div");
    head.className="code-head";
    head.innerHTML=`<span class="code-lang">${esc(lang||"code")}</span>
      <button class="code-copy" type="button">${ICONS.copy}<span>Copy</span></button>`;
    pre.replaceWith(wrap);
    wrap.appendChild(head);
    wrap.appendChild(pre);
    const btn=head.querySelector(".code-copy");
    btn.addEventListener("click",()=>{
      navigator.clipboard?.writeText(code.textContent).then(()=>{
        btn.classList.add("copied");
        btn.innerHTML=`${ICONS.check}<span>Copied</span>`;
        setTimeout(()=>{btn.classList.remove("copied");btn.innerHTML=`${ICONS.copy}<span>Copy</span>`},1600);
      }).catch(()=>showToast("Could not copy",true));
    });
  });
  // --- images: apply size hint (?w=small|medium|full), then wire lightbox ---
  bodyEl.querySelectorAll("img").forEach((im)=>{
    const m=im.src.match(/[?&]w=(small|medium|full)/);
    if(m)im.classList.add("img-size-"+m[1]);
    im.addEventListener("click",()=>window.__openLightbox(im.src,im.alt));
  });
  // --- callout icons (server emits data-icon, we slot the svg in) ---
  const CALLOUT_ICON={note:ICONS.info,info:ICONS.info,tip:ICONS.tip,warn:ICONS.warn,warning:ICONS.warn};
  bodyEl.querySelectorAll(".callout-head[data-icon]").forEach((h)=>{
    const ic=CALLOUT_ICON[h.dataset.icon]||ICONS.info;
    h.insertAdjacentHTML("afterbegin",ic);
  });
}

// Series box: shown when a post is part of a 2+ post series (see
// server-computed p.seriesInfo). Lists every part with the current one
// highlighted, clicking any part just navigates there, which doubles as
// prev/next since they're all one click away.
function seriesBoxHtml(info,currentSlug){
  if(!info)return "";
  const items=info.posts.map(part=>{
    const isCurrent=part.slug===currentSlug;
    return `<a class="series-box-item${isCurrent?" current":""}" onclick="${isCurrent?"":`go('/p/${part.slug}')`}">
      <span class="sbi-num">${part.order}</span>
      <span class="sbi-title">${esc(part.title)}</span>
      ${isCurrent?`<span class="sbi-here">Reading</span>`:""}
    </a>`;
  }).join("");
  return `<div class="series-box">
    <div class="series-box-head">
      <span class="series-box-label">${ICONS.layers} Series</span>
      <span class="series-box-progress">Part ${info.index} of ${info.total}</span>
    </div>
    <div class="series-box-title">${esc(info.name)}</div>
    <div class="series-box-list">${items}</div>
    <div style="padding:0 18px 14px"><a onclick="go('/series')" style="font-size:12px;color:var(--muted);cursor:pointer;text-decoration:none">Browse all series →</a></div>
  </div>`;
}

async function viewPost(slug){

    app.innerHTML=`${crumbs}<article class="post">
      <div class="post-meta">${p.pinned?`<span class="pinned-badge">Pinned</span>`:""}${tagChips(p.tags,3)}${me?`<button class="btn ghost small" style="margin-left:auto" onclick="togglePostPin(${p.id})">${p.pinned?"Unpin":"Pin this post"}</button>`:""}</div>
      <div style="display:flex;align-items:flex-start;gap:10px;margin-top:14px"><h1 class="post-title" style="flex:1">${esc(p.title)}</h1><span style="margin-top:8px">${bookmarkBtn(p.slug,p.title,true)}</span></div>
      ${p.subtitle?`<p class="article-subtitle">${esc(p.subtitle)}</p>`:""}
      ${byline}
      ${p.coverImage?`<img class="cover ${coverRatioClass(p)}" src="${esc(p.coverImage)}" alt="" style="object-position:${coverPosition(p)}"/>`:""}
      ${seriesBoxHtml(p.seriesInfo,p.slug)}
      <div id="tocSlot"></div>
      <div class="post-body" id="postBody">${p.html}</div>
      ${shareRow(p,url)}
      ${reactionsRow(p.slug,p.reactions||{},p.myReactions||[])}
      <div id="sponsorPost"></div>
      <div id="moreLikeSlot"></div>
      <div id="postNavSlot"></div>
      ${p.related&&p.related.length?`<div class="related"><h3>Keep reading</h3>${p.related.map(r=>`<div class="related-item" onclick="go('/p/${jsq(r.slug)}')">${esc(r.title)}</div>`).join("")}</div>`:""}
      ${commentsSection(p.slug,p.comments||[],p.rating||{count:0,average:0})}
    </article>`;
    const bodyEl=document.getElementById("postBody");
    document.getElementById("tocSlot").innerHTML=buildToc(bodyEl);

  }

// Next / previous post navigation, computed from the published list (which
// is already newest-first), rendered after the article loads so it never
// blocks the main content paint.
// Holds the current post's neighbors so the J/K keyboard shortcut (wired
// once, globally, at boot) always has something to act on without needing
// its own per-post listener setup/teardown.
let postNavTargets=null;
async function renderPostNav(slug){
  const slot=document.getElementById("postNavSlot");
  if(!slot)return;
  try{
    const posts=await api("/posts");
    const i=posts.findIndex(p=>p.slug===slug);
    if(i===-1){postNavTargets=null;return}
    const newer=posts[i-1]||null;  // list is newest-first
    const older=posts[i+1]||null;
    postNavTargets={older:older?.slug||null,newer:newer?.slug||null};
    if(!newer&&!older)return;
    slot.innerHTML=`<div class="post-nav">
      ${older?`<a onclick="go('/p/${older.slug}')"><div class="pn-label">← Older post <kbd>K</kbd></div><div class="pn-title">${esc(older.title)}</div></a>`:`<a class="pn-empty"></a>`}
      ${newer?`<a class="pn-next" onclick="go('/p/${newer.slug}')"><div class="pn-label">Newer post <kbd>J</kbd> →</div><div class="pn-title">${esc(newer.title)}</div></a>`:`<a class="pn-empty"></a>`}
    </div>`;
  }catch{postNavTargets=null}
}

// Lightweight bar chart for the top-posts panel, pure CSS bars driven by
// each post's view count relative to the highest one, no chart library.
function topChart(top){
  if(!top.length)return "";
  const rows=top.slice(0,6);
  const max=Math.max(...rows.map(p=>p.views),1);
  return `<div class="chart-bars">${rows.map(p=>{
    const h=Math.max(6,Math.round(p.views/max*100));
    return `<div class="chart-bar-wrap" title="${esc(p.title)}, ${fmtNum(p.views)} views"><span class="chart-bar-val">${fmtCompact(p.views)}</span><div class="chart-bar" style="height:${h}%"></div><span class="chart-bar-label">${esc(p.title.length>14?p.title.slice(0,13)+"…":p.title)}</span></div>`;
  }).join("")}</div>`;
}
// Subscribers panel + CSV export, the CSV is assembled client-side from the
// same endpoint the dashboard already uses; nothing new server-side.
let subscribersCache=[];
let subsQuery="";
let subsShowAll=false;
const SUBS_PREVIEW=8;

async function loadSubscribersPanel(){
  const el=document.getElementById("subsPanel");
  if(!el)return;
  try{
    subscribersCache=await api("/admin/subscribers");
    subsQuery="";subsShowAll=false;
    renderSubscribersPanel();
  }catch(e){el.textContent=e.error||"Could not load subscribers."}
}
// Rows are a 2-column grid (email | date) instead of a flex space-between.
// The email cell can shrink to zero and wraps mid-string, so a 60-character
// address folds onto a second line rather than running past the panel edge.
function renderSubscribersPanel(){
  const el=document.getElementById("subsPanel");
  if(!el)return;
  if(!subscribersCache.length){
    el.innerHTML=`<div class="illus-wrap illus-small" style="margin:0 auto 10px">${ILLUS.emptyMailbox}</div><div style="text-align:center">No subscribers yet.</div>`;
    return;
  }
  const q=subsQuery.toLowerCase();
  const matched=q?subscribersCache.filter(s=>s.email.toLowerCase().includes(q)):subscribersCache;
  const shown=subsShowAll?matched:matched.slice(0,SUBS_PREVIEW);
  const tools=`<div class="subs-tools">
      <input id="subsSearch" type="text" placeholder="filter by email…" autocomplete="off" value="${esc(subsQuery)}"/>
      <button class="btn ghost small" onclick="copySubscriberEmails()" title="Copy every matching address">Copy</button>
    </div>`;
  if(!matched.length){
    el.innerHTML=tools+`<div class="subs-foot">No address matches “${esc(subsQuery)}”.</div>`;
    wireSubsSearch();return;
  }
  const rows=shown.map(s=>
    `<div class="subs-row"><span class="se">${esc(s.email)}</span><span class="sd" title="${esc(fmtDate(s.createdAt))}">${esc(timeAgo(s.createdAt))}</span></div>`
  ).join("");
  const hidden=matched.length-shown.length;
  const foot=`<div class="subs-foot">
      <span>${fmtNum(matched.length)}${q?` of ${fmtNum(subscribersCache.length)}`:""} subscriber${matched.length===1?"":"s"}</span>
      ${hidden>0?`<button class="btn ghost small" onclick="toggleSubsShowAll()">Show all ${fmtNum(matched.length)}</button>`:""}
      ${subsShowAll&&matched.length>SUBS_PREVIEW?`<button class="btn ghost small" onclick="toggleSubsShowAll()">Collapse</button>`:""}
    </div>`;
  el.innerHTML=tools+`<div class="subs-list">${rows}</div>`+foot;
  wireSubsSearch();
}
function wireSubsSearch(){
  const inp=document.getElementById("subsSearch");
  if(!inp)return;
  let t;
  inp.oninput=()=>{clearTimeout(t);t=setTimeout(()=>{
    subsQuery=inp.value.trim();subsShowAll=false;

// Each test is a plain predicate so the list below and the filter on the post
// list can never disagree about what "missing a cover" means.
const HEALTH_TESTS={
  nocover:{label:"Published posts with no cover image",test:p=>p.status==="published"&&!p.coverImage},
  nosub:{label:"Published posts with no subtitle",test:p=>p.status==="published"&&!p.subtitle},
  notags:{label:"Posts with no topic tag",test:p=>!p.tags||!p.tags.length},
  short:{label:"Posts under two minutes long",test:p=>(p.readingTime||1)<2},
  stale:{label:"Drafts untouched for 30 days",test:p=>p.status==="draft"&&Date.now()-(p.updatedAt||p.createdAt)>30*86400000},
  soon:{label:"Scheduled to publish this week",test:p=>p.status==="scheduled"&&p.publishAt&&p.publishAt-Date.now()<7*86400000},
};
let adminHealth="";
function setAdminHealth(key){
  adminHealth=(adminHealth===key)?"":key;
  renderAdminList();
  renderHealthPanel();
  document.getElementById("allPostsPanel")?.scrollIntoView({behavior:"smooth",block:"start"});
}
function renderHealthPanel(){
  const el=document.getElementById("healthPanel");
  if(!el)return;
  const rows=Object.entries(HEALTH_TESTS).map(([key,h])=>{
    const n=adminPosts.filter(h.test).length;
    const cls=n===0?"ok":(key==="soon"?"":"warn");
    return `<div class="health-row ${cls}">
      <span class="hr-count">${n}</span>
      <span class="hr-label">${h.label}</span>
      ${n?`<button type="button" onclick="setAdminHealth('${key}')">${adminHealth===key?"Clear":"Show"}</button>`:""}
    </div>`;
  }).join("");
  el.innerHTML=rows;
}

// Publishing cadence: how many posts went out each of the last eight months.
// Bars, not a sparkline, because eight numbers do not need a line chart.
function cadenceHtml(posts){
  const months=[];
  const now=new Date();
  for(let i=7;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    months.push({key:`${d.getFullYear()}-${d.getMonth()}`,label:d.toLocaleString("en-US",{month:"short"}),n:0});
  }
  const idx=Object.fromEntries(months.map((m,i)=>[m.key,i]));
  posts.filter(p=>p.status==="published").forEach(p=>{
    const d=new Date(p.publishAt||p.createdAt);
    const k=`${d.getFullYear()}-${d.getMonth()}`;
    if(k in idx)months[idx[k]].n++;
  });
  const max=Math.max(1,...months.map(m=>m.n));
  const total=months.reduce((s,m)=>s+m.n,0);
  return `<div class="chart-bars">${months.map(m=>`
    <div class="chart-bar-wrap" title="${m.label}: ${m.n} post${m.n===1?"":"s"}">
      <span class="chart-bar-val">${m.n||""}</span>
      <div class="chart-bar" style="height:${Math.max(3,Math.round(m.n/max*100))}%"></div>
      <span class="chart-bar-label">${m.label}</span>
    </div>`).join("")}</div>
  <div class="panel-note">${total} post${total===1?"":"s"} in the last eight months, about ${(total/8).toFixed(1)} a month.</div>`;
}

  newest:(a,b)=>(b.publishAt||b.createdAt)-(a.publishAt||a.createdAt),
  oldest:(a,b)=>(a.publishAt||a.createdAt)-(b.publishAt||b.createdAt),

// Apply a Markdown formatting action to a textarea around the current
// selection (or insert a placeholder if nothing is selected). Wraps inline
// styles, prefixes block styles line-by-line, and re-selects sensibly so the
// caret lands where you'd expect. Shared by the toolbar and Ctrl/Cmd shortcuts.
function applyFormat(ta,kind,...after){
  const s=ta.selectionStart,e=ta.selectionEnd;
  const sel=ta.value.slice(s,e);
  const before=ta.value.slice(0,s),rest=ta.value.slice(e);
  const wrap=(pre,post,ph)=>{
    const inner=sel||ph;
    ta.value=before+pre+inner+post+rest;
    const start=s+pre.length;
    ta.setSelectionRange(start,start+inner.length);
  };
  const linePrefix=(pre,ph)=>{
    const inner=sel||ph;
    const out=inner.split("\n").map(l=>pre+l).join("\n");
    ta.value=before+out+rest;
    ta.setSelectionRange(s,s+out.length);
  };
  switch(kind){
    case "bold":   wrap("**","**","bold text");break;
    case "italic": wrap("*","*","italic text");break;
    case "mark":   wrap("==","==","highlighted text");break;
    case "strike": wrap("~~","~~","strikethrough text");break;
    case "code":   wrap("`","`","code");break;
    case "h2":     linePrefix("## ","Heading");break;
    case "h3":     linePrefix("### ","Subheading");break;
    case "quote":  linePrefix("> ","Quote");break;
    case "ul":     linePrefix("- ","List item");break;
    case "ol":{
      const inner=sel||"List item";
      const out=inner.split("\n").map((l,i)=>`${i+1}. ${l}`).join("\n");
      ta.value=before+out+rest;
      ta.setSelectionRange(s,s+out.length);
      break;
    }
    case "codeblock":{
      const inner=sel||"code here";
      const nl=before&&!before.endsWith("\n")?"\n":"";
      ta.value=before+nl+"```\n"+inner+"\n```\n"+rest;
      const start=s+nl.length+4;
      ta.setSelectionRange(start,start+inner.length);
      break;
    }
    case "link":{
      const text=sel||"link text";
      ta.value=before+"["+text+"](url)"+rest;
      const urlStart=s+1+text.length+2;
      ta.setSelectionRange(urlStart,urlStart+3); // select "url"
      break;
    }
  }
  ta.focus();
  after.forEach(fn=>{try{fn()}catch{}});
}

// Draft share/preview link panel: generate/revoke an unlisted token URL so
// a draft can be sent to someone for feedback without publishing it, and
// without them needing a Nalar account.
function previewLinkUrl(token){return `${location.origin}/preview/${token}`}
async function openPreviewLinkPanel(postId){

// Revision history panel: a lightweight modal listing snapshots taken
// automatically before each content-changing save (see saveRevision() on the
// server). Restoring re-loads the editor with the older content in place.
async function openHistoryPanel(postId){
  let revisions=[];
  try{revisions=await api(`/admin/posts/${postId}/revisions`)}catch(e){showToast(e.error||"Could not load history",true);return}
  const CLOSE=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg>`;
  const list=revisions.length
    ?revisions.map(r=>`<div class="history-item">
        <div class="history-item-meta">
          <span class="history-item-title">${esc(r.title)}</span>
          <span class="history-item-time">${new Date(r.createdAt).toLocaleString([],{month:"short",day:"numeric",year:"numeric",hour:"2-digit",minute:"2-digit"})}</span>
        </div>
        <button type="button" onclick="restoreRevision(${r.id},${postId})">Restore</button>
      </div>`).join("")
    :`<div style="padding:24px 4px;color:var(--muted);font-size:13px;text-align:center">No earlier versions yet, one gets snapshotted automatically the next time you save a content change.</div>`;
  document.body.insertAdjacentHTML("beforeend",`
    <div class="history-overlay" id="historyOverlay">
      <div class="history-modal">
        <button class="sub-modal-close" onclick="closeHistoryPanel()" style="position:absolute;top:14px;right:14px">${CLOSE}</button>
        <h3 style="font-family:var(--font-display);font-weight:600;font-size:20px;margin-bottom:2px">Revision history</h3>

        <div class="history-list">${list}</div>
      </div>
    </div>`);
  document.getElementById("historyOverlay").addEventListener("click",(e)=>{
    if(e.target.id==="historyOverlay")closeHistoryPanel();
  });
}
function closeHistoryPanel(){document.getElementById("historyOverlay")?.remove()}
window.restoreRevision=async(id,postId)=>{
  if(!confirm("Restore this version? Your current content will be saved as a new revision first, so you can always come back."))return;

};

    document.getElementById("wcChars").textContent=`${chars.toLocaleString()} chars`;
    document.getElementById("wcRead").textContent=`~${mins} min read`;
  }

  // --- autosave to localStorage (per draft key), debounced. This is a local
  //     safety net for unsaved work, separate from the server "Save draft".
  const draftKey="tl_draft_"+(editId||"new");
  const statusEl=document.getElementById("autosaveStatus");
  let autosaveTimer;
  function snapshot(){return JSON.stringify({title:titleEl.value,subtitle:subtitleEl.value,tags:tagsEl.value,body:bodyEl.value,cover:pendingCoverUrl,series:seriesEl.value,seriesOrder:seriesOrderEl.value,at:Date.now()})}
  function doAutosave(){
    try{
      localStorage.setItem(draftKey,snapshot());
      statusEl.className="autosave saved";
      statusEl.innerHTML=`<span class="dot"></span>Saved locally · ${new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}`;
    }catch{}
  }
  function scheduleAutosave(){
    statusEl.className="autosave";
    statusEl.innerHTML=`<span class="dot"></span>Editing…`;
    clearTimeout(autosaveTimer);
    autosaveTimer=setTimeout(doAutosave,1200);
  }
  window.__clearDraft=()=>{try{localStorage.removeItem(draftKey)}catch{}};

  // --- offer to restore a newer local draft if one exists and differs ---
  (function offerRestore(){
    let saved;try{saved=JSON.parse(localStorage.getItem(draftKey)||"null")}catch{saved=null}
    if(!saved)return;
    const sameAsLoaded=saved.title===titleEl.value&&saved.body===bodyEl.value&&saved.tags===tagsEl.value&&(saved.subtitle||"")===subtitleEl.value&&(saved.series||"")===seriesEl.value&&String(saved.seriesOrder||"")===seriesOrderEl.value;
    if(sameAsLoaded){return}
    const when=saved.at?new Date(saved.at).toLocaleString([],{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}):"earlier";
    document.getElementById("restoreSlot").innerHTML=`
      <div class="restore-banner">
        <span>Found an unsaved local draft from ${when}.</span>
        <div class="ra">
          <button id="restoreYes">Restore it</button>
          <button class="dismiss" id="restoreNo">Discard</button>
        </div>
      </div>`;
    document.getElementById("restoreYes").onclick=()=>{
      titleEl.value=saved.title||"";subtitleEl.value=saved.subtitle||"";tagsEl.value=saved.tags||"";bodyEl.value=saved.body||"";
      seriesEl.value=saved.series||"";seriesOrderEl.value=saved.seriesOrder||"";
      if(saved.cover){pendingCoverUrl=saved.cover;renderCoverArea()}
      document.getElementById("restoreSlot").innerHTML="";
      updatePreview();updateCounts();showToast("Local draft restored");
    };
    document.getElementById("restoreNo").onclick=()=>{
      window.__clearDraft();document.getElementById("restoreSlot").innerHTML="";
    };
  })();

  bodyEl.oninput=()=>{clearTimeout(t);t=setTimeout(updatePreview,300);updateCounts();scheduleAutosave()};
  titleEl.oninput=scheduleAutosave;
  subtitleEl.oninput=scheduleAutosave;
  seriesEl.oninput=scheduleAutosave;
  seriesOrderEl.oninput=scheduleAutosave;
  tagsEl.oninput=(e)=>{scheduleAutosave();updateTagSuggestions()};
  updatePreview();
  updateCounts();

  // --- tag autocomplete: suggests from tags already used elsewhere on the
  // blog, matched against whatever's typed after the last comma (not the
  // whole field, this is a multi-tag input, so a native <datalist> would
  // wrongly try to replace the entire value instead of just the last tag) ---
  let knownTags=[];
  try{knownTags=(await api("/tags")).map(t=>t.tag)}catch{knownTags=[]}
  const suggestEl=document.getElementById("tagSuggest");
  function currentTagFragment(){
    const parts=tagsEl.value.split(",");
    return {fragment:parts[parts.length-1].trim().toLowerCase(),parts};
  }
  function updateTagSuggestions(){
    const {fragment,parts}=currentTagFragment();
    const used=new Set(parts.slice(0,-1).map(t=>t.trim().toLowerCase()));
    if(!fragment){suggestEl.classList.remove("show");return}
    const matches=knownTags.filter(t=>t.toLowerCase().includes(fragment)&&!used.has(t.toLowerCase())&&t.toLowerCase()!==fragment).slice(0,6);
    if(!matches.length){suggestEl.classList.remove("show");return}
    suggestEl.innerHTML=matches.map(t=>`<button type="button" onclick="event.preventDefault();applyTagSuggestion('${esc(t).replace(/'/g,"\\'")}')">${esc(t)}</button>`).join("");
    suggestEl.classList.add("show");
  }
  window.applyTagSuggestion=(tag)=>{
    const {parts}=currentTagFragment();
    parts[parts.length-1]=` ${tag}`;
    tagsEl.value=parts.map((p,i)=>i===0?p.trim():p).join(",").replace(/^,|,$/,"")+", ";
    suggestEl.classList.remove("show");
    tagsEl.focus();
    scheduleAutosave();
  };
  document.addEventListener("click",(e)=>{
    if(!e.target.closest("#tagSuggest")&&e.target!==tagsEl)suggestEl.classList.remove("show");
  });

  // --- formatting helpers (toolbar + keyboard shortcuts) ---
  window.fmt=(kind)=>applyFormat(bodyEl,kind,updatePreview,updateCounts,scheduleAutosave);
  bodyEl.addEventListener("keydown",(e)=>{
    if(!(e.ctrlKey||e.metaKey))return;
    const k=e.key.toLowerCase();
    if(k==="b"){e.preventDefault();window.fmt("bold")}
    else if(k==="i"){e.preventDefault();window.fmt("italic")}
    else if(k==="k"){e.preventDefault();window.fmt("link")}
    else if(k==="h"&&e.shiftKey){e.preventDefault();window.fmt("mark")}
  });

  document.getElementById("inlineImgInput").onchange=async(e)=>{
    const file=e.target.files[0];if(!file)return;
    const placeholder=`![uploading ${file.name}…]()`;
    const start=bodyEl.selectionStart,end=bodyEl.selectionEnd;
    bodyEl.value=bodyEl.value.slice(0,start)+placeholder+bodyEl.value.slice(end);
    bodyEl.selectionStart=bodyEl.selectionEnd=start;
    try{
      const url=await uploadFile(file);
      pendingInlineImg={url,name:file.name.replace(/\.[^.]+$/,""),placeholder,at:start};
      document.getElementById("imgSizePopover").classList.add("show");
    }catch(err){
      bodyEl.value=bodyEl.value.replace(placeholder,"");
      showToast(err.error||"Upload failed",true);
    }
    updatePreview();
    e.target.value="";
  };
}
// Finishes an inline image insert once the user picks a size in the popover.
// Size is encoded as a query-string hint on the URL (?w=small|medium|full),
// read back by enhancePostBody() on render, same "no schema change" trick
// used for the cover focal point.
function insertSizedImage(size){
  document.getElementById("imgSizePopover").classList.remove("show");
  const img=pendingInlineImg;pendingInlineImg=null;
  if(!img)return;
  const bodyEl=document.getElementById("body");
  const sep=img.url.includes("?")?"&":"?";
  const markdown=`![${img.name}](${img.url}${sep}w=${size})`;
  bodyEl.value=bodyEl.value.replace(img.placeholder,markdown);
  showToast(`Image inserted (${size} size)`);
  updatePreview();
}

function renderCoverArea(){
  const el=document.getElementById("coverArea");
  if(pendingCoverUrl){
    const m=pendingCoverUrl.match(/[?&]focal=([\d.]+),([\d.]+)/);
    const posX=m?m[1]:50, posY=m?m[2]:50;
    const rm=pendingCoverUrl.match(/[?&]ratio=(wide|standard|tall)/);
    const ratio=rm?rm[1]:"standard";
    el.innerHTML=`
      <div class="cover-ratio-picker">
        <button type="button" class="${ratio==="wide"?"on":""}" onclick="setCoverRatio('wide')">Wide · 21:9</button>
        <button type="button" class="${ratio==="standard"?"on":""}" onclick="setCoverRatio('standard')">Standard · 16:9</button>
        <button type="button" class="${ratio==="tall"?"on":""}" onclick="setCoverRatio('tall')">Tall · 4:3</button>
      </div>
      <div class="cover-preview-wrap${ratio!=="standard"?" ratio-"+ratio:""}" id="coverFocalArea" title="Click anywhere to set the focal point, the part of the image that stays visible when it's cropped">
      <img src="${esc(pendingCoverUrl)}" alt="" style="object-position:${posX}% ${posY}%"/>
      <div class="cover-focal-dot" id="coverFocalDot" style="left:${posX}%;top:${posY}%"></div>
      <div class="cover-focal-hint">${ICONS.image} Click to set focal point</div>
      <button type="button" class="cover-remove" onclick="removeCover()" title="Remove cover image">✕</button>
    </div>`;
    const area=document.getElementById("coverFocalArea");
    area.addEventListener("click",(e)=>{
      if(e.target.closest(".cover-remove"))return;
      const rect=area.getBoundingClientRect();
      const x=Math.round(((e.clientX-rect.left)/rect.width)*100);
      const y=Math.round(((e.clientY-rect.top)/rect.height)*100);
      setCoverFocal(Math.max(0,Math.min(100,x)),Math.max(0,Math.min(100,y)));
    });
  }else{
    el.innerHTML=`
      <label class="cover-drop" id="coverDrop">
        <input type="file" id="coverInput" accept="image/png,image/jpeg,image/webp,image/gif"/>
        <div class="hint">${ICONS.image}<br/><b>Click to upload</b> or drag an image here<br/>JPEG, PNG, WEBP or GIF · up to 5MB</div>
        <div class="upload-progress" id="coverProgress"><div class="bar" id="coverBar"></div></div>
      </label>`;
    const drop=document.getElementById("coverDrop"),input=document.getElementById("coverInput");
    input.onchange=async(e)=>{const f=e.target.files[0];if(f)await handleCoverFile(f)};
    ["dragenter","dragover"].forEach(evt=>drop.addEventListener(evt,(e)=>{e.preventDefault();drop.classList.add("dragover")}));
    ["dragleave","drop"].forEach(evt=>drop.addEventListener(evt,(e)=>{e.preventDefault();drop.classList.remove("dragover")}));
    drop.addEventListener("drop",async(e)=>{const f=e.dataTransfer.files[0];if(f)await handleCoverFile(f)});
  }
}
function removeCover(){pendingCoverUrl="";renderCoverArea()}
// Rebuilds the cover URL's query string with one param replaced/removed,
// without disturbing whatever else is on it (e.g. focal + ratio can coexist
// in either order). Kept as plain string splitting rather than
// URLSearchParams because URLSearchParams would URL-encode the comma in
// "focal=50,50", breaking the plain regex parsing used elsewhere.
function setCoverParam(key,value){
  const [base,qs=""]=pendingCoverUrl.split("?");
  const parts=qs.split("&").filter(Boolean).filter((p)=>!p.startsWith(key+"="));
  if(value!=null)parts.push(`${key}=${value}`);
  pendingCoverUrl=parts.length?`${base}?${parts.join("&")}`:base;
}
function setCoverFocal(x,y){
  setCoverParam("focal",`${x},${y}`);
  const img=document.querySelector("#coverFocalArea img");
  const dot=document.getElementById("coverFocalDot");
  if(img)img.style.objectPosition=`${x}% ${y}%`;
  if(dot){dot.style.left=x+"%";dot.style.top=y+"%"}
}
// Cover aspect ratio: same "piggyback on the URL query string" trick as the
// focal point above, ?ratio=wide|standard|tall, ignored by static file
// servers, read back by coverRatioClass() wherever a cover renders.
function setCoverRatio(ratio){
  setCoverParam("ratio",ratio==="standard"?null:ratio);
  renderCoverArea();
}
async function handleCoverFile(file){
  if(!file.type.startsWith("image/")){showToast("Please choose an image file",true);return}
  if(file.size>5*1024*1024){showToast("Image is larger than 5MB",true);return}
  const bar=document.getElementById("coverBar"),wrap=document.getElementById("coverProgress");
  wrap?.classList.add("show");
  try{
    const url=await uploadFile(file,(pct)=>{if(bar)bar.style.width=pct+"%"});
    pendingCoverUrl=url;
    renderCoverArea();
    showToast("Cover image uploaded");
  }catch(err){
    showToast(err.error||"Upload failed",true);
    wrap?.classList.remove("show");
  }
}

function uploadFile(file,onProgress){
  return new Promise((resolve,reject)=>{
    const fd=new FormData();fd.append("file",file);
    const xhr=new XMLHttpRequest();
    xhr.open("POST","/api/admin/upload");
    xhr.upload.onprogress=(e)=>{if(e.lengthComputable&&onProgress)onProgress(Math.round(e.loaded/e.total*100))};
    xhr.onload=()=>{
      let data;try{data=JSON.parse(xhr.responseText)}catch{data={}}
      if(xhr.status>=200&&xhr.status<300&&data.url)resolve(data.url);
      else reject(data.error?data:{error:"Upload failed"});
    };
    xhr.onerror=()=>reject({error:"Network error during upload"});
    xhr.send(fd);
  });
}

async function savePost(editId,action){
  const err=document.getElementById("err");err.innerHTML="";
  const title=document.getElementById("title").value;
  const subtitle=document.getElementById("subtitle").value;
  const body=document.getElementById("body").value;
  if(!title.trim()||!body.trim()){err.innerHTML=errorBlock("Title and body can't be empty.");return}
  const payload={title,subtitle,tags:document.getElementById("tags").value,body,coverImage:pendingCoverUrl,action,
    series:document.getElementById("series").value,seriesOrder:document.getElementById("seriesOrder").value};
  if(action==="schedule"){
    const s=document.getElementById("schedat").value;
    if(!s){err.innerHTML=errorBlock("Pick a date/time to schedule.");return}
    payload.publishAt=new Date(s).toISOString();
  }
  const btnId=action==="publish"?"publishBtn":action==="schedule"?"scheduleBtn":"draftBtn";
  const btn=document.getElementById(btnId);
  const allBtns=["publishBtn","scheduleBtn","draftBtn"].map(id=>document.getElementById(id));
  allBtns.forEach(b=>b.disabled=true);
  const original=btn.innerHTML;
  btn.innerHTML=`<span class="spin"></span> Saving…`;
  try{
    if(editId)await api("/admin/posts/"+editId,{method:"PUT",body:JSON.stringify(payload)});
    else await api("/admin/posts",{method:"POST",body:JSON.stringify(payload)});
    if(window.__clearDraft)window.__clearDraft();
    showToast(action==="draft"?"Draft saved":action==="schedule"?"Post scheduled":"Published");
    go("/admin");
  }catch(e){
    err.innerHTML=errorBlock(e.error||"Could not save this post.");
    allBtns.forEach(b=>b.disabled=false);
    btn.innerHTML=original;
  }
}

/* ─────────────────────────────────────────────────────────────
   NAVBAR AUTO-HIDE + READING FOCUS MODE (article pages only)
   Scrolling down hides the navbar; scrolling up brings it back.
   Tapping the top zone while hidden (focus mode) reveals it again.
   ───────────────────────────────────────────────────────────── */
let navHideHandler=null,navHideState={lastY:0,ticking:false};
function mountNavAutoHide(){
  unmountNavAutoHide();
  const header=document.querySelector("header.site");
  if(!header)return;
  navHideState={lastY:window.scrollY,ticking:false};
  const zone=document.createElement("div");
  zone.className="focus-tap-zone";
  zone.id="focusTapZone";
  zone.addEventListener("click",()=>{
    document.body.classList.remove("focus-mode");
    header.classList.remove("nav-hidden");
  });
  document.body.appendChild(zone);
  navHideHandler=()=>{
    if(navHideState.ticking)return;
    navHideState.ticking=true;
    requestAnimationFrame(()=>{
      const y=window.scrollY;
      const delta=y-navHideState.lastY;
      if(y<80){
        header.classList.remove("nav-hidden");
        document.body.classList.remove("focus-mode");
      }else if(delta>4){
        header.classList.add("nav-hidden");
        document.body.classList.add("focus-mode");
      }else if(delta<-4){
        header.classList.remove("nav-hidden");
        document.body.classList.remove("focus-mode");
      }
      navHideState.lastY=y;
      navHideState.ticking=false;
    });
  };
  window.addEventListener("scroll",navHideHandler,{passive:true});
}
function unmountNavAutoHide(){
  if(navHideHandler){window.removeEventListener("scroll",navHideHandler);navHideHandler=null}
  document.getElementById("focusTapZone")?.remove();
  document.querySelector("header.site")?.classList.remove("nav-hidden");
  document.body.classList.remove("focus-mode");
}

/* ─────────────────────────────────────────────────────────────
   READING MODE
   A floating control available on article pages. Reader can set
   font size (S/M/L), column width (narrow/normal/wide), typeface
   (serif/sans) and theme (light/dark). Persisted in localStorage
   and applied via CSS variables + data-attributes on <body>.
   ───────────────────────────────────────────────────────────── */
const READER_DEFAULTS={fs:"m",width:"normal",font:"serif"};
const FS_MAP={s:0.9,m:1,l:1.15};
const WIDTH_MAP={narrow:"620px",normal:"760px",wide:"900px"};
function getReaderPrefs(){
  try{return {...READER_DEFAULTS,...JSON.parse(localStorage.getItem("tl_reader")||"{}")}}
  catch{return {...READER_DEFAULTS}}
}
function saveReaderPrefs(p){localStorage.setItem("tl_reader",JSON.stringify(p))}
function applyReaderPrefs(){
  const p=getReaderPrefs();
  document.documentElement.style.setProperty("--reader-fs",FS_MAP[p.fs]??1);
  document.documentElement.style.setProperty("--reader-measure",WIDTH_MAP[p.width]??"760px");
  document.body.setAttribute("data-reader-font",p.font);
  // reflect active states in panel if it's open
  document.querySelectorAll("[data-rp]").forEach(b=>{
    const [k,v]=b.dataset.rp.split(":");
    b.classList.toggle("on", String(p[k])===v || (k==="theme"&&getTheme()===v));
  });
}
function setReaderPref(key,val){
  if(key==="theme"){ if(getTheme()!==val) toggleTheme(); applyReaderPrefs(); return; }
  const p=getReaderPrefs(); p[key]=val; saveReaderPrefs(p); applyReaderPrefs();
}
function resetReaderPrefs(){ saveReaderPrefs({...READER_DEFAULTS}); applyReaderPrefs(); }
function unmountReader(){
  document.body.removeAttribute("data-reader-on");
  document.body.classList.remove("has-reader");
  document.getElementById("readerFab")?.remove();
  document.getElementById("readerPanel")?.remove();
  document.getElementById("pageGrid")?.classList.remove("reader-scope");
}
function mountReader(){
  if(document.getElementById("readerFab"))return;
  document.body.setAttribute("data-reader-on","1");
  document.body.classList.add("has-reader");
  document.getElementById("pageGrid")?.classList.add("reader-scope");
  const fab=document.createElement("button");
  fab.id="readerFab";fab.className="reader-fab";fab.title="Reading settings";
  fab.setAttribute("aria-label","Reading settings");
  fab.innerHTML=ICONS.reader;
  const panel=document.createElement("div");
  panel.id="readerPanel";panel.className="reader-panel";
  panel.innerHTML=`
    <div class="rp-head">
      <span class="rp-title">Reading</span>
      <button class="rp-close" id="rpClose" aria-label="Close">${ICONS.close}</button>
    </div>
    <div class="rp-group">
      <div class="rp-label">${ICONS.textSize} Text size</div>
      <div class="rp-seg">
        <button data-rp="fs:s"><span class="a">A</span></button>
        <button data-rp="fs:m"><span class="b">A</span></button>
        <button data-rp="fs:l"><span class="c">A</span></button>
      </div>
    </div>
    <div class="rp-group">
      <div class="rp-label">${ICONS.width} Column width</div>
      <div class="rp-seg">
        <button data-rp="width:narrow">Narrow</button>
        <button data-rp="width:normal">Normal</button>
        <button data-rp="width:wide">Wide</button>
      </div>
    </div>
    <div class="rp-group">
      <div class="rp-label">${ICONS.reader} Typeface</div>
      <div class="rp-seg">
        <button data-rp="font:serif" style="font-family:'Newsreader',serif">Serif</button>
        <button data-rp="font:sans" style="font-family:'Inter',sans-serif">Sans</button>
      </div>
    </div>
    <button class="rp-reset" id="rpReset">Reset to defaults</button>`;
  document.body.appendChild(fab);
  document.body.appendChild(panel);
  fab.addEventListener("click",()=>panel.classList.toggle("open"));
  panel.querySelector("#rpClose").addEventListener("click",()=>panel.classList.remove("open"));
  panel.querySelector("#rpReset").addEventListener("click",resetReaderPrefs);
  panel.querySelectorAll("[data-rp]").forEach(btn=>{
    btn.addEventListener("click",()=>{const [k,v]=btn.dataset.rp.split(":");setReaderPref(k,v)});
  });
  document.addEventListener("click",(e)=>{
    if(!panel.contains(e.target)&&!fab.contains(e.target))panel.classList.remove("open");
  });
  applyReaderPrefs();
}

function route(){
  unmountReader();
  clearReadLeft();
  unmountNavAutoHide();
  hideSidebar();
  document.getElementById("pageGrid")?.classList.remove("editor-wide");
  document.getElementById("pageGrid")?.classList.remove("admin-wide");
  window.scrollTo(0,0);
  // Admin surfaces get their own chrome: no floating search pill fighting the
  // sticky action bar, and a wider grid (set per view).
  const pth=location.pathname;
  document.body.classList.toggle("app-mode",pth==="/admin"||pth==="/write"||pth.startsWith("/edit/"));
  renderCategoryNav();
  renderNav();
  // page transition: brief fade-in on every route change
  app.classList.remove("page-enter");void app.offsetWidth;app.classList.add("page-enter");
  const path=location.pathname,params=new URLSearchParams(location.search);
  setDocTitle(null);
  if(path==="/")return viewList(params.get("q"));
  if(path==="/bookmarks"){setDocTitle("Reading list");return viewBookmarks()}
  if(path==="/about"){setDocTitle("About");return viewAbout()}
  if(path==="/now"){setDocTitle("Now");return viewNow()}
  if(path==="/archive"){setDocTitle("Archive");return viewArchive()}
  if(path==="/series"){setDocTitle("Series");return viewSeriesIndex()}
  if(path.startsWith("/p/"))return viewPost(decodeURIComponent(path.slice(3)));
  if(path.startsWith("/preview/"))return viewPreview(path.slice(9));
  if(path.startsWith("/tag/")){setDocTitle("#"+decodeURIComponent(path.slice(5)));return viewTag(decodeURIComponent(path.slice(5)))}
  if(path==="/login"){setDocTitle("Login");return viewLogin()}
  if(path==="/admin"){setDocTitle("Dashboard");return viewAdmin()}
  if(path==="/write"){setDocTitle("Write");return viewEditor(null)}
  if(path.startsWith("/edit/")){setDocTitle("Edit post");return viewEditor(Number(path.slice(6)))}
  return view404();
}
// Dynamic tab title, professional touch + helps history/bookmarks readability
function setDocTitle(sub){
  document.title=sub?`Nalar | ${sub}`:"Nalar";
}
// ---------------------------------------------------------------------------
// Command palette (Cmd/Ctrl+K), quick jump to posts, tags, and pages
// without leaving the keyboard. Debounce-searches the same /search endpoint
// the homepage uses, plus a small static list of app destinations.
// ---------------------------------------------------------------------------
let cmdkIndex=-1,cmdkItems=[],cmdkTimer=null;
function mountCmdk(){
  if(document.getElementById("cmdkOverlay"))return;
  document.body.insertAdjacentHTML("beforeend",`
    <div class="cmdk-overlay" id="cmdkOverlay" role="dialog" aria-modal="true" aria-label="Command palette">
      <div class="cmdk-box">
        <div class="cmdk-input-row">${ICONS.search}<input id="cmdkInput" type="text" placeholder="Search posts, tags, or jump to a page…" autocomplete="off"/><span class="cmdk-esc">ESC</span></div>
        <div class="cmdk-results" id="cmdkResults"></div>
      </div>
    </div>
    <div class="cmdk-hint" id="cmdkHint" onclick="openCmdk()"><span>${ICONS.command}</span><span>Search</span><kbd>${navigator.platform.includes("Mac")?"⌘":"Ctrl"}K</kbd></div>`);
  document.getElementById("cmdkOverlay").addEventListener("click",(e)=>{if(e.target.id==="cmdkOverlay")closeCmdk()});
  document.getElementById("cmdkInput").addEventListener("input",onCmdkInput);
  document.getElementById("cmdkInput").addEventListener("keydown",onCmdkKeydown);
  document.addEventListener("keydown",(e)=>{
    const mod=navigator.platform.includes("Mac")?e.metaKey:e.ctrlKey;
    if(mod&&e.key.toLowerCase()==="k"){e.preventDefault();openCmdk();return}
    if(e.key==="Escape"&&document.getElementById("cmdkOverlay")?.classList.contains("open"))closeCmdk();
  });
}
function cmdkStaticDestinations(){
  const dests=[{label:"All posts",sub:"Home",action:()=>go("/")},{label:"Series",sub:"Multi-part stories",action:()=>go("/series")},{label:"Archive",sub:"All posts by date",action:()=>go("/archive")},{label:"About",sub:"Page",action:()=>go("/about")},{label:"Reading list",sub:getBookmarks().length+" saved",action:()=>go("/bookmarks")}];
  if(me){dests.push({label:"Dashboard",sub:"Admin",action:()=>go("/admin")});dests.push({label:"Write a new post",sub:"Admin",action:()=>go("/write")})}
  else{dests.push({label:"Sign in",sub:"Admin",action:()=>go("/login")})}
  return dests;
}
function openCmdk(){
  const ov=document.getElementById("cmdkOverlay");
  ov.classList.add("open");
  const input=document.getElementById("cmdkInput");
  input.value="";
  renderCmdkResults(cmdkStaticDestinations(),"");
  setTimeout(()=>input.focus(),30);
}
function closeCmdk(){document.getElementById("cmdkOverlay")?.classList.remove("open")}
function onCmdkInput(e){
  const q=e.target.value.trim();
  clearTimeout(cmdkTimer);
  if(!q){renderCmdkResults(cmdkStaticDestinations(),"");return}
  cmdkTimer=setTimeout(async()=>{
    try{
      const posts=await api("/search?q="+encodeURIComponent(q));
      const items=posts.slice(0,8).map(p=>({label:p.title,sub:p.tags[0]?"#"+p.tags[0]:"Post",action:()=>go("/p/"+p.slug)}));
      renderCmdkResults(items,q);
    }catch{renderCmdkResults([],q)}
  },220);
}
function renderCmdkResults(items,q){
  cmdkItems=items;cmdkIndex=items.length?0:-1;
  const el=document.getElementById("cmdkResults");
  if(!items.length){el.innerHTML=`<div class="cmdk-empty">${q?`No matches for "${esc(q)}"`:"Type to search posts…"}</div>`;return}
  el.innerHTML=items.map((it,i)=>`<div class="cmdk-item${i===0?" active":""}" data-i="${i}" onclick="runCmdkItem(${i})">${esc(it.label)}<span class="cmdk-sub">${esc(it.sub||"")}</span></div>`).join("");
}
function runCmdkItem(i){
  const it=cmdkItems[i];
  if(!it)return;
  closeCmdk();
  it.action();
}
function onCmdkKeydown(e){
  if(e.key==="ArrowDown"){e.preventDefault();moveCmdk(1)}
  else if(e.key==="ArrowUp"){e.preventDefault();moveCmdk(-1)}
  else if(e.key==="Enter"){e.preventDefault();if(cmdkIndex>-1)runCmdkItem(cmdkIndex)}
}
function moveCmdk(dir){
  if(!cmdkItems.length)return;
  cmdkIndex=(cmdkIndex+dir+cmdkItems.length)%cmdkItems.length;
  document.querySelectorAll(".cmdk-item").forEach((el,i)=>el.classList.toggle("active",i===cmdkIndex));
  document.querySelector(".cmdk-item.active")?.scrollIntoView({block:"nearest"});
}

// J/K jumps to the newer/older post (Gmail/Superhuman-style), wired once
// globally rather than per-post, only acts on /p/ pages, only when nothing
// else has focus, and steps aside if any modal/overlay is open.
document.addEventListener("keydown",(e)=>{
  if(e.ctrlKey||e.metaKey||e.altKey||e.shiftKey)return;
  const k=e.key.toLowerCase();
  if(k!=="j"&&k!=="k")return;
  const tag=document.activeElement?.tagName;
  if(tag==="INPUT"||tag==="TEXTAREA"||document.activeElement?.isContentEditable)return;
  if(document.querySelector(".cmdk-overlay.open,.history-overlay,.sub-overlay.open,.lightbox.open"))return;
  if(!postNavTargets||!location.pathname.startsWith("/p/"))return;
  const target=k==="j"?postNavTargets.newer:postNavTargets.older;
  if(target)go("/p/"+target);
});

// ---------------------------------------------------------------------------
// BACKGROUND COLLAGE
// The photographs are attached after the page has painted, and only when the
// window is wide enough for any of them to be visible past the reading sheet.
// A phone never downloads them.
// ---------------------------------------------------------------------------
function mountCollage(){
  const wrap=document.querySelector(".bg-collage");
  if(!wrap||wrap.dataset.done)return;
  // Matches the CSS breakpoint. Below it the gutters are gone, so the tiles
  // would never be seen and the photographs are never requested.
  if(window.innerWidth<1460)return;
  wrap.dataset.done="1";
  wrap.querySelectorAll("span[data-bg]").forEach(el=>{
    el.style.backgroundImage=`url('${el.dataset.bg}')`;
  });
  // A timer rather than requestAnimationFrame: a page opened in a background
  // tab gets no animation frames at all, so the fade would sit at zero until
  // the reader finally looked at it.
  setTimeout(()=>wrap.classList.add("on"),60);
}
window.addEventListener("resize",()=>{clearTimeout(mountCollage._t);mountCollage._t=setTimeout(mountCollage,200)});

// Header gets a hairline shadow once the page is scrolled, a small depth cue
// that keeps the sticky bar from floating over text with no separation.
(function headerShadow(){
  const header=document.querySelector("header.site");
  if(!header)return;
  const onScroll=()=>header.classList.toggle("scrolled",window.scrollY>8);
  window.addEventListener("scroll",onScroll,{passive:true});
  onScroll();
})();

(async function(){
  const fy=document.getElementById("footerYear");
  if(fy)fy.textContent=new Date().getFullYear();
  applyReaderPrefs();
  mountSubscribeModal();
  mountSupportModal();
  mountNavDrawer();
  mountCmdk();
  await refreshMe();
  watchRenders();
  route();
  // decoration last, so it never competes with the article for bandwidth
  if(document.readyState==="complete")setTimeout(mountCollage,300);
  else window.addEventListener("load",()=>setTimeout(mountCollage,300));
})();
</script>
